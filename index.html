#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.center{align-items:center;justify-content:center;text-align:center}
h1{font-size:40px;margin:.2em 0;font-weight:900;letter-spacing:-.5px}
h2{font-size:28px;margin:.4em 0;font-weight:900}
h3{font-size:22px;margin:.6em 0 .3em;font-weight:800}
p{line-height:1.4}
.muted{color:var(--muted)}

/* Botones */
.btn{border:0;border-radius:var(--r);padding:18px 28px;font-size:26px;font-weight:900;background:var(--card);
  box-shadow:var(--shadow);transition:transform .08s ease, box-shadow .08s;min-height:72px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,42,76,.12)}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d),0 10px 24px rgba(47,182,124,.3)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.btn.orange{background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-d)}
.btn.ghost{background:transparent;box-shadow:none;border:3px solid var(--line)}
.btn.small{font-size:18px;padding:10px 16px;min-height:52px;border-radius:16px}
.btn.big{font-size:34px;padding:22px 46px;min-height:96px;border-radius:30px}
.btn[disabled]{opacity:.45}
.iconbtn{width:60px;height:60px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:28px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{transform:translateY(2px)}

/* Barra superior de sesión */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--green)}
.dots i.now{background:var(--sun);transform:scale(1.35);box-shadow:0 0 0 3px #fff}

/* Actividad */
.act{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:12px;align-items:center;max-width:1100px;width:100%;margin:0 auto}
.act .left,.act .right{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.prompt{font-size:28px;font-weight:900;text-align:center;line-height:1.25;max-width:24em}
.prompt .sub{display:block;font-size:20px;font-weight:700;color:var(--muted);margin-top:4px}
.coach{background:#FFF0C2;border-radius:16px;padding:10px 16px;font-size:20px;font-weight:800;color:#7A5A00;display:flex;gap:8px;align-items:center}
.stage{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:180px;width:100%}
.answers{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.opt{width:110px;height:110px;border-radius:28px;border:0;background:var(--card);box-shadow:0 6px 0 var(--line),0 10px 20px rgba(43,42,76,.08);
  font-size:56px;font-weight:900;color:var(--ink);transition:transform .1s, background .2s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.right{background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d);animation:pop .4s}
.opt.wrong{opacity:.3;transform:scale(.92)}
.opt.reveal{outline:6px solid var(--green);outline-offset:3px}
.msg{min-height:64px;font-size:24px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;max-width:26em;line-height:1.3}
.msg.good{color:var(--green-d)}
.msg.try{color:#B45309}
.tools{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:60px}
.continue{animation:pop .35s}
@media (orientation:landscape) and (min-width:760px){
  .act{grid-template-columns:1.25fr 1fr;grid-template-rows:1fr;}
  .act .left{grid-row:1}
}

/* Ecuación */
.eq{font-size:60px;font-weight:900;letter-spacing:1px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;line-height:1}
.eq .q{display:inline-flex;width:.95em;height:1.05em;border:5px dashed var(--orange);border-radius:16px;align-items:center;justify-content:center;color:var(--orange)}
.eq .q.filled{border-style:solid;background:var(--orange);color:#fff;animation:pop .4s}
.eq .op{color:var(--muted)}
.eq.small{font-size:36px}

/* Marco de diez */
.frames{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;background:#fff;border-radius:20px;box-shadow:var(--shadow);border:4px solid #3E3D6B}
.cell{width:var(--cs,64px);height:var(--cs,64px);border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative}
.frame.five .cell:nth-child(5n){}
.frame.tap .cell{cursor:pointer}
.ctr{width:82%;height:82%;border-radius:50%;position:relative;animation:pop .25s}
.ctr.a{background:radial-gradient(circle at 35% 30%,#6FA0FF,var(--blue) 60%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.ctr.b{background:radial-gradient(circle at 35% 30%,#FFB27D,var(--orange) 60%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.ctr.b::after{content:'★';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--cs,64px)*.42)}
.ctr.x{background:#C9D6F2;opacity:.75}
.ctr.x::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C2410C;font-weight:900;font-size:calc(var(--cs,64px)*.55)}
.ctr.g{background:transparent;border:4px dashed var(--orange);animation:pulse 1.2s infinite}
.frames.big{--cs:72px}
.frames.mid{--cs:56px}
.frames.sm{--cs:44px}
@media (max-width:520px){.frames.big{--cs:54px}.frames.mid{--cs:46px}.frames.sm{--cs:30px}.opt{width:92px;height:92px;font-size:48px}.eq{font-size:48px}}

/* Dado */
.dice{width:220px;height:220px;background:#fff;border-radius:34px;box-shadow:var(--shadow);border:4px solid #3E3D6B;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;gap:6px}
.dice span{display:flex;align-items:center;justify-content:center}
.dice span i{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6FA0FF,var(--blue) 60%);display:block}

/* Mirada rápida */
.peek{position:relative;display:inline-block}
.cloud{position:absolute;inset:-14px;background:#fff;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:var(--shadow);animation:fadein .3s}

/* Caja de fichas escondidas */
.hide-wrap{margin-top:30px;display:flex;gap:28px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.loose{display:flex;flex-wrap:wrap;gap:10px;max-width:420px;justify-content:center;min-height:70px}
.loose .ctr{width:58px;height:58px;--cs:58px;transition:transform .7s ease, opacity .7s ease}
.box{width:170px;height:140px;position:relative}
.box .body{position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(#E0A867,#C98A45);border-radius:10px 10px 18px 18px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.box .lid{position:absolute;top:8px;left:-8px;right:-8px;height:34px;background:#B97A38;border-radius:10px;transition:transform .6s ease;transform-origin:left bottom}
.box.open .lid{transform:translate(-24px,-6px) rotate(-18deg)}
.box .inside{position:absolute;left:8px;right:8px;bottom:118px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;opacity:0;transition:opacity .4s .3s}
.box.open .inside{opacity:1}
.box .inside .ctr{width:34px;height:34px;--cs:34px}
.box.shake{animation:shake .5s}

/* Recta numérica */
.nline{position:relative;width:100%;max-width:900px;padding:120px 8px 8px}
.nline .ticks{display:flex;border-top:6px solid #3E3D6B;border-radius:3px}
.nline .t{flex:1;text-align:center;position:relative;padding-top:10px;font-weight:900;font-size:26px;border:0;background:none}
.nline .t::before{content:'';position:absolute;top:-6px;left:50%;width:4px;height:18px;background:#3E3D6B;transform:translateX(-50%)}
.nline .t.start{color:var(--blue)}
.nline .t.start::after{content:'';position:absolute;top:6px;left:50%;width:44px;height:44px;border-radius:50%;border:4px solid var(--blue);transform:translateX(-50%)}
.nline .t.pickable{cursor:pointer}
.nline.n20 .t{font-size:16px}
.frog{position:absolute;top:30px;width:70px;height:70px;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.6,.6,1)}
.frog.hop{animation:hop .45s}
.arc{position:absolute;top:96px;height:34px;border:5px solid var(--orange);border-bottom:0;border-radius:50% 50% 0 0 / 100% 100% 0 0;animation:fadein .3s}
.arc.back{border-color:#C2410C;border-style:dashed;border-bottom:0}
.jumps{display:flex;gap:8px;font-size:30px}
.jumps i{width:26px;height:26px;border-radius:50%;border:4px solid var(--orange);display:block}
.jumps i.on{background:var(--orange)}

/* Cuento */
.story{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px 22px;font-size:26px;font-weight:800;line-height:1.35;max-width:640px;text-align:left;display:flex;gap:14px;align-items:flex-start}
.story .em{font-size:52px;line-height:1}
.emojis{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;font-size:46px}
.emojis span{display:inline-flex;width:64px;height:64px;align-items:center;justify-content:center;border-radius:18px;background:#fff;box-shadow:0 2px 0 var(--line)}
.emojis span.b{background:#FFE6D3;outline:3px solid var(--orange)}
.emojis span.x{opacity:.35;position:relative}
.emojis span.x::after{content:'✕';position:absolute;color:#C2410C;font-weight:900;font-size:48px}

/* Pipa */
.pipa{width:150px;height:150px;flex:none}
.pipa.sm{width:80px;height:80px}
.pipa.lg{width:210px;height:210px}
.bubble{background:#fff;border-radius:26px;padding:16px 22px;font-size:26px;font-weight:900;box-shadow:var(--shadow);position:relative;max-width:560px}
.bubble::after{content:'';position:absolute;left:30px;bottom:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.claim{font-size:54px;font-weight:900}

/* Tarjetas de juego */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:640px;width:100%}
@media (orientation:portrait){.cards{grid-template-columns:repeat(2,1fr);max-width:380px}}
.card{min-width:0;overflow:hidden;aspect-ratio:1/1;border:0;border-radius:24px;background:#fff;box-shadow:0 6px 0 var(--line);font-size:54px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s, opacity .4s}
.card.sel{background:#FFF0C2;transform:translateY(-4px);box-shadow:0 8px 0 var(--sun)}
.card.done{opacity:0;transform:scale(.6);pointer-events:none}
.card.no{animation:shake .45s}
.card .mini{--cs:13px}
.card .mini .frame{padding:3px;gap:2px;border-width:2px;border-radius:8px;box-shadow:none}
.card .mini .cell{border-radius:3px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:50px}
.chip{background:var(--green);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:22px;animation:pop .35s}

/* Río */
.river{display:flex;align-items:center;gap:10px;background:linear-gradient(#8FD3FF,#5CB8F0);border-radius:20px;padding:8px 14px;margin:0 auto 6px;max-width:520px;width:100%;justify-content:space-between}
.river .stone{width:44px;height:30px;border-radius:50%;background:#B7B2A6;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.river .bank{font-size:30px}
.river .pipa{width:46px;height:46px}

/* Inicio */
.home-top{display:flex;justify-content:space-between;align-items:center}
.gear{position:relative;width:58px;height:58px;border-radius:50%;background:transparent;border:0;font-size:28px;opacity:.55}
.gear svg{position:absolute;inset:0}
.gear .ring{stroke:var(--violet);stroke-width:5;fill:none;stroke-dasharray:170;stroke-dashoffset:170}
.stickers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:34px;max-width:600px}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:560px;width:100%}
.album div{aspect-ratio:1/1;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 3px 0 var(--line)}
.album div.empty{background:var(--soft);color:var(--line);font-size:30px;box-shadow:none}
.sticker-big{font-size:120px;animation:spin-in .8s}
.medal{font-size:26px;font-weight:900;background:#FFF0C2;border-radius:18px;padding:12px 18px;margin:6px}

/* Lección */
.lesson-title{font-size:22px;font-weight:900;color:var(--violet);display:flex;gap:8px;align-items:center;justify-content:center}
.lesson-text{font-size:40px;font-weight:900;text-align:center}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(43,42,76,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadein .2s}
.modal{background:#fff;border-radius:26px;padding:24px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* Barra para el adulto */
.adultbar{background:#EFEAFF;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:560px}
.adultbar .lbl{font-size:16px;font-weight:800;color:var(--violet)}
.adultbar .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.adultbar button{border:0;border-radius:14px;padding:10px 12px;font-size:16px;font-weight:800;background:#fff}

/* Toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:22px;border-radius:999px;padding:12px 22px;z-index:60;animation:toast 2.6s forwards;pointer-events:none;white-space:nowrap}

/* Área de adultos */
.adult{max-width:980px;width:100%;margin:0 auto;-webkit-user-select:text;user-select:text}
.adult .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.adult .tabs button{border:0;border-radius:14px;padding:10px 16px;font-weight:800;font-size:17px;background:#fff;box-shadow:0 2px 0 var(--line)}
.adult .tabs button.on{background:var(--ink);color:#fff}
.panel{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 2px 0 var(--line);margin-bottom:14px;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--soft);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:30px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.st{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.st.mastered{background:#D7F5E7;color:var(--green-d)}
.st.ready{background:#FFF0C2;color:#7A5A00}
.st.locked{background:var(--soft);color:var(--muted)}
.st.known{background:#D7F5E7;color:var(--green-d)}
.st.learning{background:#FFF0C2;color:#7A5A00}
.st.work{background:#FFE1E1;color:#B42318}
.st.none{background:var(--soft);color:var(--muted)}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}
.checks{font-size:13px;color:var(--muted)}
.checks span{margin-right:8px;white-space:nowrap}
.checks .y{color:var(--green-d);font-weight:800}
.grid-add{border-collapse:collapse;font-size:14px}
.grid-add td,.grid-add th{width:38px;height:34px;text-align:center;border:2px solid #fff;font-weight:800}
.grid-add td.known{background:#BDEBD5}.grid-add td.learning{background:#FFE7A6}.grid-add td.work{background:#FFC2C2}.grid-add td.none{background:var(--soft);color:#bbb}
.grid-add td.na{background:transparent}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.form-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:800}
.switch input{width:26px;height:26px}
textarea.backup{width:100%;min-height:110px;border-radius:14px;border:2px solid var(--line);padding:10px;font-size:13px;font-family:ui-monospace,monospace}
.pick-skill{display:flex;flex-wrap:wrap;gap:8px}
.pick-skill button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px}
.pick-skill button.on{border-color:var(--ink);background:var(--ink);color:#fff}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes fadein{from{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes hop{50%{transform:translateX(-50%) translateY(-34px)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes spin-in{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2 ---- */
.act.wide{grid-template-columns:1fr!important;grid-template-rows:auto auto auto!important;align-content:center}
.act.wide .left,.act.wide .right{grid-row:auto}
.cmpcard{border:0;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--line),0 10px 20px rgba(43,42,76,.08);padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:180px;transition:transform .1s}
.cmpcard:active{transform:translateY(4px)}
.cmpcard.right{background:#D7F5E7;box-shadow:0 6px 0 var(--green-d);animation:pop .4s}
.cmpcard.wrong{opacity:.35}
.cmpcard.reveal{outline:6px solid var(--green);outline-offset:3px}
.cmpnum{font-size:72px;font-weight:900;line-height:1}
.cmpframe .frames.mid{--cs:44px}
.house{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 6px 0 rgba(43,42,76,.12))}
.house .roof{width:280px;height:120px;background:var(--pink);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:52px;font-weight:900;color:#fff}
.house .rooms{display:flex;gap:0;background:#fff;border:5px solid #3E3D6B;border-top:0;border-radius:0 0 18px 18px;width:240px}
.house .room{flex:1;height:110px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900}
.house .room+.room{border-left:5px solid #3E3D6B}
.house .q{display:inline-flex;width:64px;height:70px;border:5px dashed var(--orange);border-radius:16px}
.house .roof .q{border-color:#fff}
.house .filled{color:var(--orange);animation:pop .4s}
.given{display:inline-flex;align-items:center;gap:10px;background:#E8F7EF;color:var(--green-d);border-radius:18px;padding:10px 18px;font-size:30px;font-weight:900}
.given b{font-size:36px}
.given .chk{background:var(--green);color:#fff;border-radius:50%;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:22px}
.then{font-size:22px;color:var(--muted);font-weight:800;margin:6px 0}
.track{display:flex;gap:12px}
.tbox{width:110px;height:110px;border-radius:24px;background:#fff;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900}
.tbox.dim{opacity:.4}
.tbox.q{border:5px dashed var(--orange);box-shadow:none;background:transparent;color:var(--orange)}
.tbox.filled{background:var(--orange);color:#fff;border-style:solid;animation:pop .4s}
.bubbles{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding:10px}
.bubble-btn{width:118px;height:118px;border-radius:50%;border:0;font-size:52px;font-weight:900;color:var(--blue-d);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 12%,rgba(190,225,255,.75) 30%,rgba(120,190,255,.55) 70%,rgba(80,160,255,.6));

/* ---- v4: Pipa viva, progreso de charca, nuevas actividades ---- */
body{background:radial-gradient(120% 60% at 50% 115%,#D9F3E4 0,rgba(217,243,228,0) 60%),var(--bg);background-attachment:fixed}
.pipa svg{overflow:visible}
.pipa .m{display:none}
.pipa .m-smile{display:inline}
.pipa.wow .m-smile,.pipa.think .m-smile,.pipa.talking .m-smile{display:none}
.pipa.wow .m-wow{display:inline}
.pipa.think:not(.talking) .m-think{display:inline}
.pipa.talking .m-talk{display:inline;animation:talk .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.pipa.talking.wow .m-wow{display:none}
.pipa .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.2s infinite}
.pipa .lid+.lid{animation-delay:.02s}
.pipa.think .pupils{transform:translate(4px,-5px)}
.pipa .pupils{transition:transform .3s}
.pipa.happy .body{animation:frogjump .55s ease-out 2;transform-box:fill-box;transform-origin:center bottom}
.pipa.think .body{animation:tilt 1.4s ease-in-out;transform-box:fill-box;transform-origin:center bottom}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96.5%{transform:scaleY(1)}}
@keyframes frogjump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.1,.88)}55%{transform:translateY(-22%) scale(.95,1.06)}100%{transform:translateY(0) scale(1,1)}}
@keyframes tilt{30%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}}

.progress{position:relative;height:18px;background:linear-gradient(#BFE6FA,#A6DBF6);overflow:visible;box-shadow:inset 0 2px 3px rgba(0,60,120,.12)}
.progress i{background:linear-gradient(90deg,#46B979,#7CD9A2);border-radius:999px}

/* ---- v7: escribir, manos, ficha del cole, tren, dominó ---- */
.eq .q{width:auto;min-width:.95em;padding:0 .1em}
.eq .q.typing{border-style:solid;color:var(--ink);background:#fff}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(100%,400px)}
.key{min-height:64px;border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:34px;font-weight:900;color:var(--ink);transition:transform .06s}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.key.del{grid-column:span 2;background:var(--soft);font-size:28px}
.key.ok{grid-column:span 3;background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.numpad.off{opacity:.35;pointer-events:none}
.numpad.shake,.srow.shake,.wagon.shake{animation:shake .45s}

.hands{display:flex;gap:14px;justify-content:center;align-items:flex-end}

.sheetact .left{width:100%}

.wagon::before,.wagon::after{content:'';position:absolute;bottom:-12px;width:16px;height:16px;border-radius:50%;background:#3E3D6B}
.wagon::before{left:10px}.wagon::after{right:10px}
.wagon.on{background:linear-gradient(#6FA0FF,var(--blue));box-shadow:0 5px 0 var(--blue-d);width:72px;height:60px;font-size:32px;pointer-events:none;animation:pop .3s}

.domino{display:flex;background:#fff;border:5px solid #3E3D6B;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}

.dhalf .mini,.dopt .mini{--cs:18px}

  // Pista concreta según el error cometido (si se reconoce); si no, null y se usa el truco general.

  function diagnoseError(it, v) {
    v = Number(v);
    if (!it || !Number.isFinite(v) || v === it.answer) return null;
    const mk = (id, text, say) => ({ id, text, say: say || text });
    const kind = it.kind;
    if (it.op === 'bond' || (it.op === '-' && (kind === 'hidden' || kind === 'missing'))) {
      const have = it.have, total = it.total;
      if (v === total) return mk('total', 'Ese es el total. ¿Cuántos faltan?', 'Ese número es el total. Yo te pregunto cuántos faltan.');
      if (v === have) return mk('have', 'Esos ya los tenemos. ¿Cuántos faltan?', 'Esos ya los tenemos. Yo te pregunto cuántos faltan.');
      if (Math.abs(v - it.answer) === 1) return mk('off1', '¡Casi! Cuenta los huecos despacio, de uno en uno.', '¡Casi! Te has quedado muy cerca. Cuenta los huecos despacio, de uno en uno.');
      return null;
    }
    if (it.op === '+' && it.spec && it.spec.op === '+') {
      const a = it.a, b = it.b, big = Math.max(a, b), small = Math.min(a, b);
      if (v === it.c - 1 && small >= 1) return mk('counton', 'Casi. El ' + big + ' ya lo tienes: empieza a contar en el ' + (big + 1) + '.', 'Casi. El ' + big + ' ya lo tienes. Empieza a contar en el ' + (big + 1) + '.');
      if (v === it.c + 1) return mk('over1', 'Casi. Te has pasado por uno. Cuenta solo ' + small + ' más.', 'Casi. Te has pasado por uno. Cuenta solo ' + small + ' más.');
      if (a !== b && v === big - small) return mk('wrongop', '¡Ojo! Es una suma: juntamos, no quitamos.', '¡Ojo! Es una suma. Juntamos, no quitamos.');
      if (v === a || v === b) return mk('addend', 'Ese es uno de los dos números. Hay que juntar los dos.', 'Ese es uno de los dos números. Hay que juntar los dos.');
      return null;
    }
    if (it.op === '-' && it.spec && it.spec.op === '-') {
      const a = it.a, b = it.b;
      if (v === a + b) return mk('wrongop', '¡Ojo! Es una resta: quitamos, no juntamos.', '¡Ojo! Es una resta. Quitamos, no juntamos.');
      if (v === b && b !== it.c) return mk('subtrahend', 'Esos son los que quitamos. ¿Cuántos quedan?', 'Esos son los que quitamos. Yo te pregunto cuántos quedan.');
      if (v === it.c + 1) return mk('countback', 'Casi. Al contar hacia atrás, el ' + a + ' no se cuenta: empieza en el ' + (a - 1) + '.', 'Casi. Al contar hacia atrás, el ' + a + ' no se cuenta. Empieza en el ' + (a - 1) + '.');
      if (v === it.c - 1) return mk('over1', 'Casi. Has quitado uno de más. Quita solo ' + b + '.', 'Casi. Has quitado uno de más. Quita solo ' + b + '.');
      if (v === a) return mk('minuend', 'Ese es el número del principio. Hay que quitarle ' + b + '.', 'Ese es el número del principio. Hay que quitarle ' + b + '.');
      return null;
    }
    if (it.op === 'n' && (kind === 'quick')) {
      if (Math.abs(v - it.a) === 1) return it.a > 5 ? mk('off1', '¡Casi! Busca la fila de 5 y mira cuántas hay además.', '¡Casi! Busca la fila de cinco, y mira cuántas hay además.') : mk('off1', '¡Casi! Míralas otra vez, despacio.', '¡Casi! Míralas otra vez, despacio.');
    }
    return null;
  }

  // Problemas de combinación: dos grupos que se juntan (todo desconocido) o un grupo
  // del que se conoce una parte (parte desconocida).
  const COMBO = [
    { e: '🍎', e2: '🍏', s: 'manzana', p: 'manzanas', g: 'f', a1: ['roja', 'rojas'], a2: ['verde', 'verdes'] },
    { e: '🌹', e2: '🌼', s: 'flor', p: 'flores', g: 'f', a1: ['roja', 'rojas'], a2: ['amarilla', 'amarillas'] },

  function makeCombineStory(r, spec) {
    const o = pick(r, COMBO);
    const cu = o.g === 'f' ? '¿Cuántas' : '¿Cuántos';
    const one = o.g === 'f' ? 'una' : 'un';
    const grp = (n, adj) => (n === 1 ? one + ' ' + o.s + ' ' + adj[0] : n + ' ' + o.p + ' ' + adj[1]);
    if (spec.op === '+') {

    }

    const known = spec.b === 1 ? (o.g === 'f' ? 'Una es ' : 'Uno es ') + o.a1[0] : spec.b + ' son ' + o.a1[1];
    const rest = spec.c === 1 ? (o.g === 'f' ? 'la otra es ' : 'el otro es ') + o.a2[0] : (o.g === 'f' ? 'las demás son ' : 'los demás son ') + o.a2[1];

  function makeStory(r, spec) {

  }

  /* ---------- generador de ejercicios ---------- */
  let ITEM_ID = 0;
  function makeItem(st, skill, opts) {
    opts = opts || {};
    const r = opts.r || makeRng(st.seed + (ITEM_ID + 1) * 7919);
    const ss = st.skills[skill];
    const def = SK[skill];
    const level = Math.max(0, Math.min(2, opts.level != null ? opts.level : ss.level));
    const ease = !!opts.ease;
    let spec = opts.spec;
    if (!spec) {
      const P = pool(st, skill, ease, !!opts.full);
      spec = weightedPick(st, r, P, ss.recent && ss.recent.length ? ss.recent : (ss.lastKey ? [ss.lastKey] : []));
    }
    let kinds = (opts.kind ? [opts.kind] : ACTS[skill][level]).slice();
    if (opts.mode === 'challenge' || opts.mode === 'diag') { const k2 = kinds.filter((k) => k !== 'talk' && k !== 'place'); if (k2.length) kinds = k2; }
    // variedad: no repetir el mismo tipo de actividad si hay otros
    if (kinds.length > 1 && ss.lastKind && kinds.includes(ss.lastKind) && r() < 0.75) kinds = kinds.filter((k) => k !== ss.lastKind);
    let kind = pick(r, kinds);
    const it = {
      id: ++ITEM_ID, skill, level, kind, op: spec.op, a: spec.a, b: spec.b, c: spec.c, key: spec.key,
      max: def.max, ease, mode: opts.mode || 'normal', spec: { op: spec.op, a: spec.a, b: spec.b, c: spec.c, key: spec.key },
    };
    const hi = def.max;
    // Respuesta y formato según tipo

      const flip = r() < 0.5;
      it.x = flip ? spec.b : spec.a; it.y = flip ? spec.a : spec.b;
      it.ask = level === 0 ? 'more' : (r() < 0.6 ? 'more' : 'less');

    } else if (spec.op === 'bond') {

      if (kind === 'house') { it.format = 'a+?=T'; it.side = r() < 0.5 ? 'L' : 'R'; }

    } else if (spec.op === '+') {

      if (kind === 'related' && spec.a === spec.b) kind = it.kind = 'choose';
      if (kind === 'nextnum' && spec.b !== 1) kind = it.kind = 'choose';
      if (kind === 'storyMissing') {

        it.format = 'a+?=T'; it.cap = 10;

        if (it.claim == null) { it.claimTrue = true; it.claim = spec.c; }

        if (it.claim == null) { it.claimTrue = true; it.claim = spec.c; }

      else { it.op = 'n'; it.a = n; it.b = 0; it.c = n; it.n = n; it.answer = n; it.lineMin = mn; it.lineMax = mx; it.labels = [mn, mn + 5, mx]; it.options = null; it.cap = mx; }

      const n = spec.op === 'bond' ? spec.c : spec.a;
      if (n < 4) { it.kind = 'quick'; it.flash = 3000; it.pattern = 'frame'; it.op = 'n'; it.a = n; it.b = 0; it.c = n; it.answer = n; it.options = makeOptions(r, n, 1, 10, []); }
      else {
        it.n = n; it.op = 'n'; it.a = n; it.b = 0; it.c = n; it.answer = n; it.key = 'talk' + n;
        const cands = [];
        for (let x = 1; x < n; x++) if (x >= n - x) cands.push([x, n - x]);
        const five = n > 5 ? [5, n - 5] : null;

    }
    if (spec.op === 'cmp') {
      it.pic = level <= 1;
      it.hint = strategyFor({ op: 'cmp' });
      return it;
    }
    it.pic = level <= 1; // a nivel 2 el dibujo está detrás del botón de ayuda
    it.hint = strategyFor(it.op === 'bond' ? { op: 'bond', a: it.have, b: it.answer, c: it.total } : { op: spec.op, a: spec.a, b: spec.b, c: spec.c });
    return it;
  }

  // Crea el ejercicio de un hueco de la sesión con el nivel actual de la habilidad
  function itemForSlot(st, slot, r) {
    const ss = st.skills[slot.skill], def = SK[slot.skill];
    let level = ss.level;
    // repasos de lecciones anteriores: en su nivel de dominio (ver o pensar)
    if (slot.mode === 'review') level = def.masteryLevel;
    if (slot.levelOffset) level = Math.max(0, level + slot.levelOffset);
    if (slot.level != null) level = slot.level;
    const ease = !!slot.ease || (slot.mode === 'normal' && ss.wrongStreak >= 1);
    let kind = slot.kind;
    if (!kind && slot.prefer && r) {
      const ok = slot.prefer.filter((k) => ACTS[slot.skill][Math.max(0, Math.min(2, level))].includes(k));
      if (ok.length && r() < 0.8) kind = pick(r, ok);
    }
    return makeItem(st, slot.skill, { r, level, ease, mode: slot.mode, kind });
  }

  /* ---------- expresiones ---------- */
  function exprText(it) {
    const M = '−';
    if (it.op === 'cmp') return '';
    if (it.op === 'bond') {
      const a = it.have, T = it.total;
      switch (it.format) {
        case '?+a=T': return '? + ' + a + ' = ' + T;
        case 'T=a+?': return T + ' = ' + a + ' + ?';
        case 'T-a=?': return T + ' ' + M + ' ' + a + ' = ?';
        default: return a + ' + ? = ' + T;
      }
    }
    if (it.format === 'next') return it.a + ' + 1 = ?';
    if (it.format === 'prev') return it.a + ' ' + M + ' 1 = ?';
    if (it.op === '+') return it.format === '?=a+b' ? '? = ' + it.a + ' + ' + it.b : it.a + ' + ' + it.b + ' = ?';
    if (it.op === '-') {
      if (it.kind === 'hidden' || it.kind === 'missing') {
        if (it.format === 'a+?=T') return it.have + ' + ? = ' + it.total;
        return it.total + ' ' + M + ' ' + it.have + ' = ?';
      }
      return it.a + ' ' + M + ' ' + it.b + ' = ?';
    }
    return '';
  }
  function evalSide(sd) {
    const t = sd.replace(/−/g, '-').trim().split(/\s+/);
    let v = Number(t[0]);
    for (let i = 1; i < t.length; i += 2) v = t[i] === '+' ? v + Number(t[i + 1]) : v - Number(t[i + 1]);
    return v;
  }
  function eqHolds(txt) {
    const parts = txt.split('=');
    return parts.length === 2 && evalSide(parts[0]) === evalSide(parts[1]);
  }
  function solvedText(it) {
    return exprText(it).replace('?', String(it.answer));
  }
  // Cómo lo diría un adulto en voz alta (no «siete más interrogación igual a diez»)
  function exprSpeech(txt) {
    const t = txt.replace(/−/g, '-').replace(/\s+/g, ' ').trim();
    let m;
    if ((m = t.match(/^(\d+) \+ \? = (\d+)$/))) return m[1] + ', ¿y cuántos más para llegar a ' + m[2] + '?';
    if ((m = t.match(/^\? \+ (\d+) = (\d+)$/))) return '¿Qué número y ' + m[1] + ' son ' + m[2] + '?';
    if ((m = t.match(/^(\d+) = (\d+) \+ \?$/))) return m[1] + ' es ' + m[2] + ' y ¿cuántos más?';
    if ((m = t.match(/^\? = (\d+) ([+-]) (\d+)$/))) return m[1] + (m[2] === '+' ? ' más ' : ' menos ') + m[3] + ', ¿cuánto es?';
    if ((m = t.match(/^(\d+) ([+-]) (\d+) = \?$/))) return m[1] + (m[2] === '+' ? ' más ' : ' menos ') + m[3] + ', ¿cuánto es?';
    return t.replace(/\+/g, ' más ').replace(/-/g, ' menos ').replace(/=/g, ' son ').replace(/\?/g, 'cuánto').replace(/\s+/g, ' ').trim();
  }
  /* ---------- voz grabada: frases y claves ---------- */
  // Lo que dice Pipa se trocea en frases; cada frase tiene una clave fija que da nombre
  // a su archivo de audio (voice/<clave>.mp3). Así se pueden combinar frases ya grabadas.
  function splitSay(text) {
    const m = String(text || '').replace(/\s+/g, ' ').trim().match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [];
    return m.map((x) => x.trim()).filter((x) => /[0-9A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(x));
  }
  function sayKey(sentence) {
    const t = String(sentence).replace(/\s+/g, ' ').trim();
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < t.length; i++) {
      const c = t.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 + c, 0x5bd1e995) >>> 0; h2 = (h2 ^ (h2 >>> 13)) >>> 0;
    }
    return ('0000000' + h1.toString(16)).slice(-8) + ('000' + (h2 & 0xffff).toString(16)).slice(-4);
  }
  function checkAnswer(it, v) { return it.kind === 'talk' ? true : Number(v) === it.answer; }

  /* ---------- validación de ejercicios ---------- */
  function validateItem(it) {
    const E = [];
    if (it.op === 'cmp') {
      if (!(Number.isInteger(it.x) && Number.isInteger(it.y)) || it.x === it.y) E.push('comparación inválida');
      if (it.x > 10 || it.y > 10 || it.x < 1 || it.y < 1) E.push('comparación fuera de rango');
      if (it.answer !== (it.ask === 'more' ? Math.max(it.x, it.y) : Math.min(it.x, it.y))) E.push('respuesta comparación');
      if (!it.options || it.options.length !== 2 || !it.options.includes(it.answer)) E.push('opciones comparación');
      return E;
    }
    if (it.given && !eqHolds(it.given)) E.push('hecho dado falso: ' + it.given);
    if (it.kind === 'related' && !it.given) E.push('falta el hecho relacionado');
    const isInt = (v) => Number.isInteger(v) && v >= 0;
    ['a', 'b', 'c', 'answer'].forEach((k) => { if (!isInt(it[k])) E.push('no entero/negativo: ' + k + '=' + it[k]); });
    const def = SK[it.skill];
    if ((it.c > def.max || it.a > def.max) && it.kind !== 'place') E.push('supera el máximo de la habilidad');
    if (it.op === '+') {
      if (it.a + it.b !== it.c) E.push('suma incorrecta');
      if (it.answer !== it.c) E.push('respuesta suma');
    } else if (it.op === '-') {
      if (it.a - it.b !== it.c) E.push('resta incorrecta');
      if (it.c < 0) E.push('resultado negativo');
      if (it.answer !== it.c) E.push('respuesta resta');
      if ((it.kind === 'hidden' || it.kind === 'missing') && it.total - it.have !== it.answer) E.push('resta faltante');
    } else if (it.op === 'bond') {
      if (it.have + it.answer !== it.total) E.push('pareja incorrecta');
      if (it.have < 0 || it.have > it.total) E.push('pareja fuera de rango');
    } else if (it.op === 'n') {
      if (it.answer !== it.a) E.push('cantidad');
    }
    if (it.cap != null) {
      const need = it.op === 'bond' ? it.total : (it.op === '-' ? it.a : it.c);
      if (it.kind !== 'missing' && need > it.cap) E.push('no cabe en el marco');
      if (it.op === '+' && it.cap === 10 && it.c > 10) E.push('marco pequeño');
    }
    if (it.options) {
      if (it.options.length !== 3) E.push('no hay 3 opciones');
      if (new Set(it.options).size !== it.options.length) E.push('opciones repetidas');
      if (!it.options.includes(it.answer)) E.push('falta la respuesta correcta');
      if (it.options.some((v) => !isInt(v))) E.push('opción no válida');
    } else if (it.kind === 'place') {
      if (!(it.n > it.lineMin && it.n < it.lineMax) || it.labels.includes(it.n) || it.answer !== it.n) E.push('recta incoherente');
    } else if (it.kind === 'talk') {
      if (!it.splits || it.splits.length < 2 || it.splits.some((x) => x[0] + x[1] !== it.n || x[1] < 1)) E.push('charla numérica incoherente');
      if (new Set(it.splits.map((x) => x.join('+'))).size !== it.splits.length) E.push('charla: formas repetidas');
    } else if (!['build1', 'build', 'fill', 'take', 'jump', 'jumpBack'].includes(it.kind) || it.kind === 'quick') {
      if (it.kind !== 'build1') E.push('faltan opciones');
    }
    if (it.kind === 'truefalse') {
      if (it.claimTrue !== (it.claim === it.answer)) E.push('afirmación incoherente');
    }
    if (it.kind === 'storyCombine' && !(it.story && it.story.combine && /¿Cuánt/.test(it.story.text) && (it.story.combine === 'whole' ? it.a + it.b === it.answer : it.a - it.b === it.answer))) E.push('combinación incoherente');
    if (it.kind === 'storyCompare' && !(it.story && it.story.text.includes('Pipa') && it.a > it.b)) E.push('comparación sin datos');
    if (it.kind === 'quick' && !(it.a >= 1 && it.a <= 10)) E.push('cantidad rápida fuera de rango');
    if (['build', 'build1', 'fill', 'take', 'jump', 'jumpBack'].includes(it.kind) && it.options && it.kind === 'build1') E.push('build1 sin opciones');
    if (it.kind === 'jump' && it.c > (it.cap === 20 ? 20 : 10)) E.push('recta corta');
    if (it.kind === 'storyMissing' && !(it.story && it.story.text.includes(String(it.total)) && it.story.text.includes(String(it.have)) || (it.have === 1))) E.push('cuento sin datos');
    if (it.kind === 'story' && !(it.story && (it.story.text.includes(String(it.b)) || (it.b === 1 && /\b(Un|Una|Uno|un|una|uno)\b/.test(it.story.text))))) E.push('cuento sin números');
    return E;
  }

  /* ---------- registro y adaptación (dentro de la sesión) ---------- */
  // Adaptación transparente y determinista: sube un nivel de ayuda tras 4 aciertos
  // seguidos sin ayuda; tras 2 fallos seguidos baja un nivel, repite la explicación
  // y propone un ejercicio más fácil. La rapidez nunca cuenta.
  function recordAttempt(st, it, res, ctx) {
    ctx = ctx || {};
    const ss = st.skills[it.skill];
    const mode = ctx.mode || it.mode || 'normal';
    const indep = !!(res.correct && res.firstTry && !res.hint);
    const events = [];
    const f = st.facts[it.key] || { n: 0, indep: 0, ok: 0, miss: 0 };
    f.n++; if (indep) f.indep++; if (res.correct) f.ok++; if (!res.firstTry || !res.correct) f.miss++;
    st.facts[it.key] = f;
    if (mode === 'game') return { indep, events };
    const key = it.spec ? it.spec.key : it.key;
    // memoria a largo plazo (si la hay): el tiempo solo cuenta cuando responde «de cabeza»
    if (st.mem && it.kind !== 'talk') noteFact(st, key, { indep, correct: !!res.correct, firstTry: !!res.firstTry, ms: it.level === 2 && !res.hint ? res.ms : null });
    ss.lastKey = key;
    ss.recent = (ss.recent || []).concat([key]).slice(-3);
    ss.lastKind = it.kind;
    ss.hist.push({ k: it.key, l: it.level, i: indep, ok: !!res.correct, h: !!res.hint, m: mode, st: res.strat || null, kd: it.kind });
    if (mode !== 'normal' || it.kind === 'talk') return { indep, events }; // las charlas no cambian el nivel
    if (indep) {
      ss.wrongStreak = 0; ss.okStreak++;
      if (ss.okStreak >= 4 && ss.level < 2 && st.auto) { ss.level++; ss.okStreak = 0; events.push('levelUp'); }
    } else if (!res.firstTry || !res.correct) {
      ss.okStreak = 0; ss.wrongStreak++;
      if (ss.wrongStreak >= 2) {
        if (ss.level > 0 && st.auto) { ss.level--; events.push('levelDown'); }
        ss.wrongStreak = 0; ss.needLesson = true; events.push('struggle');
      }
    } else { // acierto con ayuda
      ss.wrongStreak = 0;
    }
    return { indep, events };
  }

  /* ---------- memoria de cada operación (se guarda en el aparato) ---------- */
  // Por cada operación: veces vista (n), aciertos a la primera y sin ayuda (ok), fallos (miss),
  // tiempo medio de respuesta en ms cuando acierta de cabeza (ms), último día (last) y «caja»
  // de repaso espaciado (box 0-4: cuanto más alta, mejor la sabe y más se espacia).
  // El tiempo NUNCA se enseña a la niña ni decide si supera algo: solo sirve para elegir qué
  // practicar (lo que acierta despacio suele estar contándolo todavía con los dedos).
  const SLOW_MS = 6000;
  const BOX_GAP = [0, 1, 2, 4, 8];
  function noteFact(st, key, r) {
    const mem = st.mem; if (!mem || !key) return null;
    const f = mem[key] || { n: 0, ok: 0, miss: 0, ms: 0, last: 0, box: 0 };
    f.n++;
    if (r.indep) {
      f.ok++; f.box = Math.min(4, f.box + 1);
      if (r.ms && r.ms > 300) { const t = Math.min(20000, Math.round(r.ms)); f.ms = f.ms ? Math.round(f.ms * 0.6 + t * 0.4) : t; }
    } else if (!r.correct || r.firstTry === false) { f.miss++; f.box = Math.max(0, f.box - 2); }
    f.last = st.day || 0;
    mem[key] = f;
    return f;
  }
  function factState(f) {
    if (!f || !f.n) return 'new';
    if (f.box <= 1) return 'learning';
    return f.ms && f.ms > SLOW_MS ? 'counting' : 'known';
  }
  // Peso para elegir qué preguntar: más lo que falla, lo que tarda y lo que toca repasar
  function factWeight(f, day) {
    if (!f || !f.n) return 1.6;
    const base = [4, 3, 1.8, 1, 0.5][Math.max(0, Math.min(4, f.box))];
    const slow = f.ms > SLOW_MS ? 1.2 : 0;
    const due = (day - f.last) >= BOX_GAP[Math.max(0, Math.min(4, f.box))] ? 1 : 0.35;
    return (base + slow) * due;
  }

  /* ---------- programa diario ---------- */
  // Una sesión al día. Cada lección se reparte en varios días: presentación → práctica (las
  // que hagan falta) → reto. A los pocos días de superar un reto hay una comprobación corta
  // (repaso espaciado); cada 5 días, un día de repaso mezclado. Al acabar todas las lecciones,
  // sigue con repasos centrados en lo que más cuesta.
  function newProgress() {
    const P = { v: 1, day: 0, dates: [], lessons: {}, facts: {}, exams: [] };
    SKILLS.forEach((s) => (P.lessons[s.id] = { step: 0, sessions: 0, level: 0, lastAcc: null, passed: false, passedOn: null, confirmed: false, tries: 0, cool: 0 }));
    return P;
  }
  function fixProgress(P) {
    const N = newProgress();
    if (!P || typeof P !== 'object' || !P.lessons) return N;
    N.day = Math.max(0, P.day | 0);
    N.dates = Array.isArray(P.dates) ? P.dates.filter((d) => typeof d === 'string').slice(-90) : [];
    SKILLS.forEach((s) => { if (P.lessons[s.id]) Object.assign(N.lessons[s.id], P.lessons[s.id]); });
    if (Array.isArray(P.exams)) N.exams = P.exams.filter((e) => e && typeof e.n === 'number').slice(-30);
    if (P.facts && typeof P.facts === 'object') for (const k in P.facts) { const f = P.facts[k]; if (f && typeof f.n === 'number') N.facts[k] = { n: f.n | 0, ok: f.ok | 0, miss: f.miss | 0, ms: f.ms | 0, last: f.last | 0, box: Math.max(0, Math.min(4, f.box | 0)) }; }
    return N;
  }
  function currentLesson(P) { const s = SKILLS.find((x) => !P.lessons[x.id].passed); return s ? s.id : null; }
  function passedLessons(P) { return SKILLS.filter((x) => P.lessons[x.id].passed).map((x) => x.id); }
  function playedOn(P, date) { return P.dates.includes(date); }
  function lessonReady(ls) { return ls.sessions >= 3 && ls.level >= 2 && ls.lastAcc != null && ls.lastAcc >= 0.8 && !ls.cool; }
  // Lo floja que está una lección ya superada (para elegir qué repasar)
  function lessonNeed(P, skill) {
    const st = newState(1, { level: 2 });
    const keys = pool(st, skill, false, true).map((p) => p.key);
    return keys.reduce((a, k) => a + factWeight(P.facts[k], P.day), 0) / keys.length;
  }
  function weightedLessons(P, r, list, n) {
    const out = [];
    const w = list.map((k) => lessonNeed(P, k) + (P.lessons[k].confirmed ? 0 : 1));
    for (let i = 0; i < n; i++) {
      let tot = w.reduce((a, b) => a + b, 0), x = r() * tot, j = 0;
      for (; j < list.length - 1; j++) { x -= w[j]; if (x <= 0) break; }
      out.push(list[j]);
    }
    return out;
  }
  // opts: { seed, short }
  // Cada lección tiene 12 sesiones numeradas (lección-sesión: «6-4»). Van de lo concreto a lo
  // abstracto y de lo guiado a lo independiente, y la última es el reto:
  const SESSIONS = [
    { name: 'Pipa lo explica', level: 0 },
    { name: 'Con fichas', level: 0 },
    { name: 'Con dibujos', level: 1 },
    { name: 'Con dibujos y repaso', level: 1 },
    { name: 'De cabeza', level: 2 },
    { name: 'Escribir el resultado', level: 2 },
    { name: 'Mezcla con lo anterior', level: 2 },
    { name: 'Cuentos y problemas', level: 2 },
    { name: 'Día de juegos', level: 2 },
    { name: 'Ensayo del reto', level: 2 },
    { name: 'La ficha grande', level: 2 },
    { name: 'El reto', level: 2 },
  ];
  const NSES = SESSIONS.length;
  // Dónde está: { lesson: índice 0…, session: 1…12 } o null si ha terminado todas
  function position(P) {
    const cur = currentLesson(P);
    if (!cur) return null;
    return { lesson: skillIndex(cur), skill: cur, session: Math.max(0, Math.min(NSES - 1, P.lessons[cur].step | 0)) + 1 };
  }
  // Saltar a una lección y sesión concretas («6-4»): lo anterior se da por superado
  function setPosition(P, lessonNumber, session) {
    const li = Math.max(0, Math.min(SKILLS.length - 1, (lessonNumber | 0) - 1));
    SKILLS.forEach((sk, k) => {
      const ls = P.lessons[sk.id];
      if (k < li) { if (!ls.passed) { ls.passed = true; ls.passedOn = P.day; ls.confirmed = true; ls.level = 2; } ls.step = NSES - 1; }
      else Object.assign(ls, { passed: false, passedOn: null, confirmed: false, step: 0, cool: 0 });
    });
    P.lessons[SKILLS[li].id].step = Math.max(0, Math.min(NSES - 1, (session | 0) - 1));
    return position(P);
  }
  // opts: { seed, short, lastGame }
  function planDay(P, opts) {
    opts = opts || {};
    const r = makeRng(opts.seed || (P.day * 7919 + 13));
    const cur = currentLesson(P), passed = passedLessons(P);
    const steps = [];
    const plan = { day: P.day + 1, type: 'practice', skill: cur, steps, checkup: null, session: null, startLevel: null };
    const game = (avoid) => gameFor(cur, r, { avoid: avoid || opts.lastGame });
    const review = (n, lvl) => weightedLessons(P, r, passed, n).forEach((k) => steps.push(lvl == null ? { type: 'item', skill: k, mode: 'review', phase: 'warm' } : { type: 'item', skill: k, mode: 'review', phase: 'practice', level: lvl }));
    if (!cur) {
      // Programa terminado: repasos sin fin de lo que más cuesta, escribiendo
      plan.type = 'maintenance';
      plan.skill = weightedLessons(P, r, passed, 1)[0];
      review(opts.short ? 8 : 12, 2);
      const arith = passed.filter((k) => GAMES[k].includes('sheet'));
      if (arith.length) steps.push(gameStep(weightedLessons(P, r, arith, 1)[0], 'sheet', r));
      steps.push(gameFor(plan.skill, r, { avoid: 'sheet' }));
      steps.push({ type: 'end' });
      return plan;
    }
    const ls = P.lessons[cur];
    const n = Math.max(0, Math.min(NSES - 1, ls.step | 0)) + 1; // sesión 1…12
    plan.session = n; plan.startLevel = SESSIONS[n - 1].level;
    const N = (k) => (opts.short ? Math.max(4, k - 3) : k);
    const item = (extra) => steps.push(Object.assign({ type: 'item', skill: cur, mode: 'normal', phase: 'practice' }, extra || {}));
    // Arranque: repaso breve de lo anterior; en la sesión 3, comprobación de la lección recién superada
    const due = passed.find((k) => !P.lessons[k].confirmed);
    if (n === 3 && due) { plan.checkup = due; for (let i = 0; i < 6; i++) steps.push({ type: 'item', skill: due, mode: 'review', phase: 'checkup', level: 2 }); }
    else if (passed.length && n !== 12) review(opts.short ? 2 : 3);
    const hasSheet = GAMES[cur].includes('sheet');
    switch (n) {
      case 1: // Pipa lo explica
        plan.type = 'intro';
        if (!passed.length) for (let i = 0; i < 2; i++) steps.push({ type: 'item', skill: cur, mode: 'warm', phase: 'warm', level: 0, ease: true });
        if (LESSONS[cur]) steps.push({ type: 'lesson', skill: cur, phase: 'lesson' });
        for (let i = 0; i < 3; i++) steps.push({ type: 'item', skill: cur, mode: 'guided', phase: 'guided', levelOffset: -1 });
        for (let i = 0; i < N(8); i++) item();
        steps.push(game());
        break;
      case 2: case 3: case 5: // con fichas, con dibujos, de cabeza
        steps.push({ type: 'item', skill: cur, mode: 'guided', phase: 'guided', levelOffset: -1 });
        for (let i = 0; i < N(10); i++) item();
        steps.push(game());
        break;
      case 4: // con dibujos y repaso intercalado
        for (let i = 0; i < N(10); i++) { if (passed.length && (i === 3 || i === 7)) review(1, null); item(); }
        steps.push(game());
        break;
      case 6: // escribir el resultado
        for (let i = 0; i < N(9); i++) item({ prefer: ['write', 'missing', 'choose'] });
        steps.push(hasSheet ? gameStep(cur, 'sheet', r) : game());
        break;
      case 7: // mezcla con lecciones anteriores
        for (let i = 0; i < N(6); i++) { item(); if (passed.length) review(1, 2); }
        steps.push(game('sheet'));
        break;
      case 8: // cuentos y problemas
        for (let i = 0; i < N(10); i++) item({ prefer: ['story', 'storyMissing', 'storyCombine', 'storyCompare', 'truefalse', 'related', 'house', 'hidden', 'talk', 'place', 'nextnum'] });
        steps.push(game());
        break;
      case 9: { // día de juegos
        plan.type = 'games';
        for (let i = 0; i < 4; i++) item();
        const g1 = game();
        steps.push(g1);
        steps.push(gameFor(cur, r, { avoid: g1.game }));
        break;
      }
      case 10: // ensayo del reto: como el reto pero más corto y con toda la ayuda
        for (let i = 0; i < N(12); i++) item({ level: 2 });
        steps.push(game());
        break;
      case 11: // la ficha grande
        for (let i = 0; i < N(6); i++) item({ prefer: ['write'] });
        steps.push(hasSheet ? gameStep(cur, 'sheet', r) : game());
        steps.push(game('sheet'));
        break;
      default: // 12: el reto

        steps.push({ type: 'challenge' });
        steps.push(game('sheet'));

  }
  // Estado de sesión para el día: niveles guardados y memoria de operaciones
  function dayState(P, seed) {
    const st = newState(seed, { level: 'auto' });
    SKILLS.forEach((s) => { st.skills[s.id].level = P.lessons[s.id].passed ? 2 : 0; });
    const pos = position(P);
    if (pos) st.skills[pos.skill].level = SESSIONS[pos.session - 1].level;
    st.mem = P.facts; st.day = P.day;
    return st;
  }
  // out: { date, level, practice: { n, indep }, checkup: { n, indep }, challenge: resultado | null }
  function finishDay(P, plan, out) {
    const events = [];
    P.day++;
    if (out.date && !P.dates.includes(out.date)) { P.dates.push(out.date); if (P.dates.length > 90) P.dates.shift(); }
    if (plan.checkup && out.checkup && out.checkup.n >= 4) {
      const ls = P.lessons[plan.checkup];
      ls.confirmed = true; // se comprueba una vez; si falló, sus operaciones ya pesan más en los repasos
      events.push(out.checkup.indep / out.checkup.n >= 0.8 ? 'confirmed' : 'recheck');
    }
    const cur = plan.skill && plan.type !== 'maintenance' ? P.lessons[plan.skill] : null;
    if (cur && plan.type !== 'challenge') {
      cur.sessions++;
      if (out.level != null) cur.level = Math.max(0, Math.min(2, out.level | 0));
      if (out.practice && out.practice.n) cur.lastAcc = out.practice.indep / out.practice.n;
      cur.step = Math.min(NSES - 1, (cur.step | 0) + 1);
    }
    if (cur && plan.type === 'challenge' && out.challenge) {
      if (out.challenge.passed) { markPassed(P, plan.skill); events.push('passed'); }
      else { cur.tries++; cur.step = NSES - 3; events.push('retry'); } // vuelve al ensayo (sesión 10) antes de repetir el reto
    }
    return events;
  }
  function markPassed(P, skill) {
    const ls = P.lessons[skill];
    if (!ls) return;
    if (!ls.passed) { ls.passed = true; ls.passedOn = P.day; ls.confirmed = false; }
    ls.level = 2; ls.step = NSES - 1;
  }
  // Resumen para el adulto
  function progressSummary(P) {
    const st = newState(1, { level: 2 });
    const lessons = SKILLS.map((s) => {
      const ls = P.lessons[s.id];
      const keys = Array.from(new Set(pool(st, s.id, false, true).map((p) => p.key)));
      const c = { new: 0, learning: 0, counting: 0, known: 0 };
      keys.forEach((k) => c[factState(P.facts[k])]++);

    });
    const hard = Object.keys(P.facts).filter((k) => /^\d+[+-]\d+$|\+\?=/.test(k)).map((k) => ({ key: k, f: P.facts[k], w: factWeight(Object.assign({}, P.facts[k], { last: -99 }), P.day) }))
      .filter((x) => x.f.n >= 2 && (x.f.box <= 1 || x.f.ms > SLOW_MS)).sort((a, b) => b.w - a.w || b.f.miss - a.f.miss).slice(0, 12)

  }
  /* ---------- sincronización entre aparatos ---------- */
  // Una «copia» es { rev, progress, trophies, stickers, points, last, lastGame }.
  // Nunca se pierde nada ganado: los amigos y trofeos se unen, las estrellas se quedan con
  // el máximo y de cada operación se conserva la memoria con más intentos.
  function cleanSave(x) {
    x = x && typeof x === 'object' ? x : {};
    const tro = {};
    if (x.trophies && typeof x.trophies === 'object') Object.keys(x.trophies).forEach((k) => { if (SK[k] && x.trophies[k]) tro[k] = x.trophies[k]; });
    const lg = {};
    if (x.lastGame && typeof x.lastGame === 'object') Object.keys(x.lastGame).forEach((k) => { if (SK[k]) lg[k] = String(x.lastGame[k]).slice(0, 12); });
    return {
      rev: Number(x.rev) || 0,
      progress: fixProgress(x.progress),
      trophies: tro,
      stickers: Array.isArray(x.stickers) ? x.stickers.filter((s) => typeof s === 'string').slice(0, 200) : [],

      last: SK[x.last] ? x.last : null,

  }
  function mergeSaves(main, other) {
    const a = cleanSave(main), b = cleanSave(other);

    b.stickers.forEach((s) => { if (!out.stickers.includes(s)) out.stickers.push(s); });
    out.points = Math.max(a.points, b.points);
    Object.keys(b.progress.facts).forEach((k) => { const f = b.progress.facts[k], g = out.progress.facts[k]; if (!g || f.n > g.n) out.progress.facts[k] = f; });
    b.progress.dates.forEach((d) => { if (!out.progress.dates.includes(d)) out.progress.dates.push(d); });
    out.progress.dates.sort(); if (out.progress.dates.length > 90) out.progress.dates = out.progress.dates.slice(-90);
    const seen = new Set(out.progress.exams.map((e) => JSON.stringify(e)));
    b.progress.exams.forEach((e) => { if (!seen.has(JSON.stringify(e))) out.progress.exams.push(e); });
    out.progress.exams = out.progress.exams.slice(-30);

  }
  // Qué hacer al sincronizar. local/remote: copias; dirty: hay cambios locales sin subir;
  // base: rev de la última copia remota que este aparato vio.
  // Devuelve { save, adopt (hay que aplicar save aquí), push (hay que subir save) }.
  function resolveSync(local, remote, st) {
    st = st || {};
    const L = cleanSave(local);
    if (!remote || !remote.rev) return { save: L, adopt: false, push: true };
    const R = cleanSave(remote);
    const same = (x, y) => JSON.stringify(Object.assign({}, x, { rev: 0 })) === JSON.stringify(Object.assign({}, y, { rev: 0 }));
    let main, other;
    if (!st.dirty) { main = R; other = L; } // este aparato no ha cambiado nada: manda lo de la nube
    else if (R.rev === st.base) { main = L; other = R; } // la nube no ha cambiado: manda lo de aquí
    else if (R.progress.day > L.progress.day) { main = R; other = L; } // han cambiado los dos: gana quien más sesiones lleva
    else { main = L; other = R; }
    const save = mergeSaves(main, other);
    return { save, adopt: !same(save, L), push: !same(save, R) };
  }
  function factLabel(key) {
    return key.replace(/^(\d+)\+\?=(\d+)$/, '$1 + ? = $2').replace(/^(\d+)\+(\d+)$/, '$1 + $2').replace(/^(\d+)-(\d+)$/, '$1 − $2');
  }

  /* ---------- plan de una lección elegida ---------- */
  // Devuelve "huecos"; cada ejercicio se genera en el momento, con el nivel actual.
  // opts: { seed, short, skipLesson }
  function planLesson(skill, opts) {
    opts = opts || {};
    if (!SK[skill]) throw new Error('lección desconocida ' + skill);
    const r = makeRng(opts.seed || 1);
    const prev = prevLessons(skill);
    const steps = [];
    // 1. Calentamiento con lecciones anteriores del camino (repaso sin guardar nada)
    const nWarm = opts.short ? 2 : 3;
    if (prev.length) {
      const near = prev.slice(0, 3), older = prev.slice(3);
      for (let i = 0; i < nWarm; i++) {
        const sk = (i === nWarm - 1 && older.length) ? pick(r, older) : near[i % near.length];
        steps.push({ type: 'item', skill: sk, mode: 'review', phase: 'warm' });
      }
    } else {
      for (let i = 0; i < 2; i++) steps.push({ type: 'item', skill, mode: 'warm', phase: 'warm', level: 0, ease: true });
    }
    // 2. «Mira cómo lo hace Pipa» (se puede saltar)
    if (LESSONS[skill] && !opts.skipLesson) steps.push({ type: 'lesson', skill, phase: 'lesson' });
    // 3. Ejercicios guiados, con la pista visible
    const nGuided = opts.short ? 2 : 3;
    for (let i = 0; i < nGuided; i++) steps.push({ type: 'item', skill, mode: 'guided', phase: 'guided', levelOffset: -1 });
    // 4. Práctica adaptativa con repaso intercalado de lecciones anteriores
    const nPractice = opts.short ? 7 : 10;
    const reviewAt = prev.length ? (opts.short ? [4] : [3, 7]) : [];
    for (let i = 0; i < nPractice; i++) {
      if (reviewAt.includes(i)) steps.push({ type: 'item', skill: pick(r, prev.slice(0, 4)), mode: 'review', phase: 'practice' });
      steps.push({ type: 'item', skill, mode: 'normal', phase: 'practice' });
    }
    // 5. Juego de consolidación
    steps.push(gameFor(skill, r, { avoid: opts.lastGame }));
    // 6. Ofrecer el reto final
    steps.push({ type: 'offer', skill, phase: 'offer' });
    // 7. Cierre
    steps.push({ type: 'end' });

  }
  // Cada lección tiene varios juegos posibles (de formatos distintos) y se van alternando.
  const GAMES = {
    sub5: ['match', 'flies', 'memory', 'order'],
    compare: ['match', 'flies', 'memory', 'order'],
    sub10: ['dice', 'match', 'flies', 'shop', 'order'],
    bond5: ['pairs', 'bubbles', 'memory', 'balance', 'sheet'],
    bond10: ['pairs', 'bubbles', 'memory', 'balance', 'flies', 'sheet'],
    more1: ['river', 'flies', 'balance', 'order', 'sheet'],
    addon: ['river', 'flies', 'balance', 'sheet'],
    dbl: ['dice', 'memory', 'flies', 'domino', 'sheet'],
    near: ['dice', 'memory', 'flies', 'domino', 'balance', 'sheet'],
    from10: ['pairs', 'bubbles', 'memory', 'balance', 'flies', 'sheet'],
    bondN: ['pairs', 'bubbles', 'balance', 'shop', 'sheet'],
    add10: ['dice', 'flies', 'balance', 'shop', 'memory', 'domino', 'sheet'],
    sub10t: ['river', 'flies', 'balance', 'memory', 'sheet'],
    mix10: ['river', 'flies', 'balance', 'memory', 'shop', 'sheet'],
    teen: ['shop', 'flies', 'river', 'order', 'sheet'],
    teen2: ['river', 'flies', 'shop', 'order', 'sheet'],
    add20: ['dice', 'shop', 'flies', 'balance', 'domino', 'sheet'],
    sub20: ['river', 'flies', 'balance', 'sheet'],
    mix20: ['river', 'flies', 'balance', 'shop', 'sheet'],
  };
  function gameStep(skill, game, r) {
    const step = { type: 'game', game, skill };
    if (game === 'pairs' || game === 'bubbles') {
      step.skill = skill === 'from10' ? 'bond10' : skill;
      step.target = skill === 'bond5' ? 5 : (skill === 'bondN' ? pick(r, [6, 7, 8, 9]) : 10);
    } else if (game === 'match') step.max = skill === 'sub5' ? 5 : 10;
    else if (game === 'dice') step.mode = skill === 'sub10' ? 'count' : (skill === 'dbl' ? 'double' : (skill === 'add20' ? 'big' : 'add'));
    else if (game === 'river') step.n = 4;

  }
  // opts.avoid: juego que no debe repetirse (el de la última vez)
  function gameFor(skill, r, opts) {
    let list = GAMES[skill] || ['river'];
    if (opts && opts.avoid && list.length > 1) list = list.filter((g) => g !== opts.avoid);
    return gameStep(skill, pick(r, list), r);
  }

  /* ---------- minijuego «La ficha del cole» ---------- */
  // Una ficha como las de clase: varias operaciones escritas y hay que escribir el resultado.
  function makeSheetGame(r, skill, n) {
    const st = newState(1, { level: 2 });
    const P = shuffle(r, pool(st, skill, false, true)).filter((p) => p.op === '+' || p.op === '-' || p.op === 'bond');
    const rows = [];
    const seen = new Set();
    for (const p of P) {
      if (rows.length >= (n || 6)) break;
      if (seen.has(p.key)) continue;
      seen.add(p.key);
      if (p.op === 'bond') rows.push({ text: p.a + ' + ? = ' + p.c, answer: p.b, spec: p });
      else rows.push({ text: p.a + (p.op === '+' ? ' + ' : ' − ') + p.b + ' = ?', answer: p.c, spec: p });
    }
    return { rows };
  }

  /* ---------- modo examen ---------- */
  // Operaciones escritas como en clase, sin ayuda; al final se corrige y se pone nota.
  // Entra lo que ya ha trabajado en el programa (y la lección en curso), pesando más lo que le cuesta.
  function examLessons(P) {
    const cur = currentLesson(P);
    const list = passedLessons(P).concat(cur ? [cur] : []).filter((k) => GAMES[k].includes('sheet'));
    return list.length ? list : ['bond5'];
  }
  // Dificultad del examen, del 1 al 10. El 1 ya son sumas y restas (sin las triviales de +0 o +1).
  // max: número más grande que aparece · min: tamaño mínimo del total · bond: proporción de huecos (7 + ? = 10)
  const EXAM_LEVELS = [null,
    { max: 6, min: 4, bond: 0, name: 'Sumas y restas hasta 6' },
    { max: 8, min: 5, bond: 0, name: 'Sumas y restas hasta 8' },
    { max: 10, min: 6, bond: 0, name: 'Sumas y restas hasta 10' },
    { max: 10, min: 6, bond: 0.3, name: 'Hasta 10, con huecos (7 + ? = 10)' },
    { max: 12, min: 8, bond: 0.2, name: 'Hasta 12' },
    { max: 14, min: 9, bond: 0.2, name: 'Hasta 14, pasando del 10' },
    { max: 16, min: 10, bond: 0.25, name: 'Hasta 16' },
    { max: 18, min: 11, bond: 0.25, name: 'Hasta 18' },
    { max: 20, min: 12, bond: 0.3, name: 'Hasta 20' },
    { max: 20, min: 13, bond: 0.4, name: 'Hasta 20, con muchos huecos' },
  ];
  function examCandidates(level) {
    const L = EXAM_LEVELS[Math.max(1, Math.min(10, level | 0))];
    const sums = [], subs = [], bonds = [];
    for (let c = L.min; c <= L.max; c++) for (let a = 2; a <= Math.min(10, c - 2); a++) {
      const b = c - a;
      if (b < 2 || b > 10) continue;
      sums.push({ op: '+', a, b, c, key: a + '+' + b });
      subs.push({ op: '-', a: c, b, c: a, key: c + '-' + b });
      bonds.push({ op: 'bond', a, b, c, key: bondKey(a, c) });
