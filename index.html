      P('Se empieza por ver cantidades de un vistazo usando el 5 y el 10 como referencia («7 es 5 y 2»). Así la pareja 7 + 3 = 10 se ve en el marco y no hay que contar desde 1.'),
      P('En cada lección salen más a menudo las operaciones que falla, nunca la misma dos veces seguidas, y se repasan lecciones anteriores en el calentamiento y en la práctica.'),
      P('El signo = aparece también en formatos como «10 = 7 + ?» o «? = 6 + 2», para que no lo entienda solo como «aquí va el resultado».'),
      P('Si acompañas, activa en Ajustes el «Modo acompañado»: tras cada acierto podrás anotar si contó con los dedos desde 1, contó desde un número o lo sabía. Si cuenta todo desde 1 a menudo, conviene seguir en esa lección aunque acierte.')));
  }
  function aSettings(body) {
    const nameIn = h('input', { value: S.name, 'aria-label': 'Nombre', class: 'inp' });
    const tog = (key, label) => { const c = h('input', { type: 'checkbox' }); c.checked = !!S.settings[key]; c.addEventListener('change', () => { S.settings[key] = c.checked; save(); }); return h('label', { class: 'switch' }, c, label); };
    body.appendChild(h('div', { class: 'panel' }, h('h3', null, 'Nombre'),
      h('div', { class: 'form-row' }, nameIn, h('button', { class: 'btn small', onclick: () => { S.name = nameIn.value.trim() || 'Olivia'; save(); toast('Guardado'); } }, 'Guardar'))));
    const vsel = h('select', { class: 'inp', 'aria-label': 'Voz' });
    Voice.list.forEach((v) => { const o = h('option', { value: v.name }, v.name + ' · ' + v.lang); if (Voice.voice && Voice.voice.name === v.name) o.selected = true; vsel.appendChild(o); });
    vsel.addEventListener('change', () => { S.settings.voiceName = vsel.value; save(); Voice.pick(); Voice.say('¡Hola, ' + N() + '! Soy Pipa. ¿Jugamos con los números?'); });
    const rate = h('input', { type: 'range', min: '0.7', max: '1.2', step: '0.05', value: String(S.settings.rate || 0.95), 'aria-label': 'Velocidad de la voz' });
    rate.addEventListener('change', () => { S.settings.rate = Number(rate.value); save(); Voice.say('Hola, ' + N() + '. ¿Me oyes bien?'); });
    const pitch = h('input', { type: 'range', min: '0.85', max: '1.25', step: '0.05', value: String(S.settings.pitch || 1.05), 'aria-label': 'Tono de la voz' });
    pitch.addEventListener('change', () => { S.settings.pitch = Number(pitch.value); save(); Voice.say('¿Así te gusta más, ' + N() + '?'); });
    if (voiceQuality(Voice.voice) !== 'good' && !Voice.useBank()) {
      const ios = /iPhone|iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
      body.appendChild(h('div', { class: 'panel warn' }, h('h3', null, '🔈 Este aparato usa una voz básica'),
        h('p', null, 'Suena robótica. Para que Pipa hable de forma natural, instala una voz de mejor calidad (gratis):'),
        h('p', null, ios ? 'iPhone/iPad: Ajustes → Accesibilidad → Contenido leído → Voces → Español (España) → Mónica (mejorada) o una voz «Premium». Después elígela aquí abajo.'
          : 'Android: Ajustes → Sistema → Idiomas → Salida de texto a voz → Motor de Google → ⚙️ → Instalar datos de voz → Español (España). En ordenador, Microsoft Edge trae voces naturales («Elvira Online (Natural)»).')));
    }
    const modeSel = h('select', { class: 'inp', 'aria-label': 'Tipo de voz' },
      h('option', { value: 'pipa' }, 'Voz de Pipa (grabada, igual en todos los aparatos)'), h('option', { value: 'device' }, 'Voz de este aparato'));
    modeSel.value = S.settings.voiceMode === 'device' ? 'device' : 'pipa';
    modeSel.addEventListener('change', () => { S.settings.voiceMode = modeSel.value; save(); Voice.say('¡Hola! Soy Pipa. ¿Jugamos?'); });
    const dl = h('span', { class: 'muted' }, '');
    const dlBtn = h('button', { class: 'btn small', onclick: async () => {
      if (!Voice.bank) { dl.textContent = 'La voz grabada no está disponible ahora.'; return; }
      dlBtn.disabled = true;
      try {
        const cache = await caches.open('mates-pipa-voz-2');
        const keys = Array.from(Voice.bank); let n = 0, bad = 0;
        for (let i = 0; i < keys.length; i += 12) {
          await Promise.all(keys.slice(i, i + 12).map(async (k) => { const u = 'voice/' + k + '.mp3'; try { if (!(await cache.match(u))) { const r = await fetch(u); if (r.ok) await cache.put(u, r); else bad++; } } catch (e) { bad++; } n++; }));
          dl.textContent = 'Descargando… ' + Math.round(n / keys.length * 100) + ' %';
        }
        dl.textContent = bad ? 'Descargada en parte (' + bad + ' frases pendientes). Inténtalo otra vez con buena conexión.' : '✅ Voz descargada: Pipa habla también sin internet.';
      } catch (e) { dl.textContent = 'No se ha podido descargar.'; }
      dlBtn.disabled = false;
    } }, '⬇️ Descargar la voz para usarla sin internet');
    body.appendChild(h('div', { class: 'panel' }, h('h3', null, 'Voz de Pipa'),
      tog('voice', 'Voz activada'),
      h('div', { class: 'form-row' }, modeSel),
      Voice.bank ? h('div', { class: 'form-row' }, dlBtn, dl) : null,
      h('p', { class: 'muted' }, 'La voz grabada se va guardando sola según se usa. Lo que no esté grabado (o si no hay internet y aún no se ha descargado) lo dice la voz de este aparato.'),
      Voice.list.length ? h('div', { class: 'form-row' }, h('span', null, 'Voz:'), vsel) : h('p', { class: 'muted' }, 'Este navegador no ofrece voces en español.'),
      h('div', { class: 'form-row' }, h('span', null, 'Velocidad'), rate),
      h('div', { class: 'form-row' }, h('span', null, 'Tono'), pitch),
      h('div', { class: 'form-row' }, h('button', { class: 'btn small', onclick: () => Voice.say('¡Hola, ' + N() + '! Soy Pipa. Vamos a aprender las parejas del diez. Siete y tres, diez.') }, '🔊 Probar voz'),
        h('span', { class: 'muted' }, 'En uso: ' + Voice.engine)),
      h('p', { class: 'muted' }, 'iPhone/iPad: las voces más naturales son las «mejoradas» o «premium». Se descargan en Ajustes → Accesibilidad → Contenido leído → Voces → Español (España), por ejemplo «Mónica (mejorada)».'),
      h('p', { class: 'muted' }, 'Android: Ajustes → Sistema → Idiomas → Salida de texto a voz → Motor de Google → ⚙️ → Instalar datos de voz → Español (España).')));
    body.appendChild(h('div', { class: 'panel' }, h('h3', null, 'Opciones'),
      tog('sfx', 'Sonidos suaves al acertar (y vibración en Android)'),
      tog('companion', 'Modo acompañado: tras cada acierto, el adulto anota cómo lo ha resuelto'),
      tog('short', 'Lecciones cortas (unos 6 minutos, para días de cansancio)'),
      tog('fullscreen', 'Pantalla completa al empezar una lección (si no está instalada)')));
    body.appendChild(h('div', { class: 'panel' }, h('h3', null, 'Trofeos de este dispositivo'),
      h('p', null, Object.keys(S.trophies).length ? Object.keys(S.trophies).map((k) => '🏆 ' + C.LESSON_INFO[k].short + ' (' + S.trophies[k].score + ', ' + S.trophies[k].day + ')').join(' · ') : 'Todavía no hay trofeos.'),
      h('button', { class: 'btn small danger', onclick: async () => {
        const v = await modal('¿Borrar los trofeos?', 'Solo de este dispositivo. No afecta a nada más.', [{ t: 'Cancelar', v: false, cls: 'primary' }, { t: 'Borrar', v: true }]);
        if (v) { S.trophies = {}; S.last = null; save(); adultScreen('ajustes'); }
      } }, 'Borrar trofeos')));
    body.appendChild(h('p', { class: 'muted small' }, 'Mates con Pipa · versión ' + (window.APP_VERSION || 'local')));
  }

  /* ---------- arranque ---------- */
  function splash() {
    const scr = h('div', { class: 'screen center splash' },
      pipa('lg bob live'),
      h('h1', null, 'Mates con Pipa'),
      h('p', { class: 'muted strong' }, 'Para ' + N()),
      h('button', { class: 'btn primary big', onclick: () => {
        // la voz y el sonido solo se desbloquean con un toque (iOS)
        Voice.unlock(); Fx.ac();
        homeScreen();
        setTimeout(() => Voice.say('¡Hola, ' + N() + '! Soy Pipa. Toca el botón verde para hacer la lección.'), 120);
      } }, 'Toca para empezar'));
    show(scr);
  }
  function boot() {
    S = loadProfile();
    Voice.init();
    // sincronizar al abrir y cada vez que se vuelve a la app; si llega progreso nuevo y no está
    // en mitad de una sesión, se refresca la pantalla
    Sync.onChange = () => { if (!APP.exit && document.querySelector('.home, .album-scr, .gamegrid')) { toast('☁️ Progreso actualizado'); if (document.querySelector('.album-scr')) albumScreen(); else if (document.querySelector('.gamegrid')) gamesScreen(); else homeScreen(); } };
    Sync.run();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !APP.exit) Sync.run(); });
    window.addEventListener('online', () => Sync.run());
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) { /* */ }
    splash();
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.__noSW) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
    // botón «atrás» de Android: salir de la sesión con confirmación
    window.addEventListener('popstate', () => { if (APP.exit) { history.pushState(null, ''); APP.exit(); } });
    try { history.pushState(null, ''); } catch (e) { /* */ }
  }
  Object.assign(APP, {
    get state() { return ST; }, get profile() { return S; }, Voice,
    home: () => homeScreen(), album: () => albumScreen(), sync: () => Sync.run(), syncState: () => ({ state: Sync.state, base: S.sync.base, dirty: S.sync.dirty, busy: Sync.busy }), exam: (n, l) => examScreen(n, l), examStart: () => examStart(), games: () => gamesScreen(), lessons: () => lessonsScreen(), jump: () => jumpSheet(), addPoints: (n) => addPoints(n), clearAllow: () => {}, setPos: (l, n) => { C.setPosition(S.progress, l, n); }, startDay, freeGame, progressOf: () => (S ? S.progress : null), setMulti: (v) => { S.settings.multi = !!v; },
    adult: (t) => adultScreen(t), diag: () => startDiagnostic(),
    startLesson, startChallenge: startChallengeOnly, explain: explainOnly, sheet: (k) => lessonSheet(k),
    // para las pruebas visuales: una sola actividad, un juego o una pantalla final
    demo: (skill, kind, level) => runSession([{ type: 'item', skill, mode: 'normal', kind, level }, { type: 'end' }], { kind: 'explain', skill }),
    demoGame: (step) => runSession([step, { type: 'end' }], { kind: 'explain', skill: step.skill }),
    demoEnd: (skill, r) => endScreen(skill, { items: 30, start: Date.now() - 600000 }, r),
    demoHands: (n) => show(h('div', { class: 'screen center' }, Hands(n))),
    demoReward: (n) => gameReward(addPoints(n), gamesScreen),
    demoOffer: (skill) => runSession([{ type: 'offer', skill }, { type: 'end' }], { kind: 'explain', skill }),
  });
  Object.defineProperty(APP, 'progress', { get: () => (S ? S.progress : null) });
  window.__app = APP;
  boot();
})();
</script>
