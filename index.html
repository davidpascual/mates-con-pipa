  }
  // Nivel de examen que corresponde a lo que lleva hecho del programa (para proponerlo)
  function suggestExamLevel(P) {
    const i = currentLesson(P) ? skillIndex(currentLesson(P)) : SKILLS.length;
    return i <= 7 ? 1 : (i <= 10 ? 2 : (i <= 12 ? 3 : (i <= 14 ? 4 : (i <= 16 ? 5 : (i <= 17 ? 7 : 9)))));
  }
  function makeExam(P, r, n, level) {
    if (level) {
      const { L, sums, subs, bonds } = examCandidates(level);
      const total = n || 10, nb = Math.round(total * L.bond), ns = Math.ceil((total - nb) / 2), nr = total - nb - ns;
      const take = (list, k) => {
        const out = [], cand = list.map((q) => ({ q, w: factWeight(P.facts[q.key], P.day) }));
        while (out.length < k && cand.length) {
          let tot = cand.reduce((a, c) => a + c.w, 0), x = r() * tot, j = 0;
          for (; j < cand.length - 1; j++) { x -= cand[j].w; if (x <= 0) break; }
          out.push(cand.splice(j, 1)[0].q);
        }
        return out;
      };
      const skill = L.max > 10 ? 'mix20' : 'mix10';
      const rows = take(sums, ns).concat(take(subs, nr), take(bonds, nb)).map((q) => ({
        text: q.op === 'bond' ? q.a + ' + ? = ' + q.c : q.a + (q.op === '+' ? ' + ' : ' − ') + q.b + ' = ?', answer: q.op === 'bond' ? q.b : q.c, spec: q, skill }));
      return { level: Math.max(1, Math.min(10, level | 0)), rows: shuffle(r, rows) };
    }
    const st = newState(1, { level: 2 });
    const cands = [];
    const seen = new Set();
    examLessons(P).forEach((sk) => pool(st, sk, false, true).forEach((q) => {
      if (seen.has(q.key) || !(q.op === '+' || q.op === '-' || q.op === 'bond')) return;
      seen.add(q.key);
      cands.push({ spec: q, skill: sk, w: factWeight(P.facts[q.key], P.day) });
    }));
    const rows = [];
    let guard = 0;
    while (rows.length < Math.min(n || 10, cands.length) && guard++ < 2000) {
      const left = cands.filter((c) => !c.used);
      let tot = left.reduce((a, c) => a + c.w, 0), x = r() * tot, pickd = left[left.length - 1];
      for (const c of left) { x -= c.w; if (x <= 0) { pickd = c; break; } }
      pickd.used = true;
      const q = pickd.spec;
      rows.push({ text: q.op === 'bond' ? q.a + ' + ? = ' + q.c : q.a + (q.op === '+' ? ' + ' : ' − ') + q.b + ' = ?', answer: q.op === 'bond' ? q.b : q.c, spec: q, skill: pickd.skill });
    }
    return { rows: shuffle(r, rows) };
  }
  // answers: lo que ha escrito en cada fila (null si la dejó en blanco)
  function gradeExam(rows, answers) {
    const marks = rows.map((row, i) => answers[i] != null && Number(answers[i]) === row.answer);
    const ok = marks.filter(Boolean).length, n = rows.length;
    const nota = n ? Math.round(ok / n * 100) / 10 : 0;
    const label = nota >= 9 ? '¡Sobresaliente!' : (nota >= 7 ? '¡Notable!' : (nota >= 5 ? '¡Bien!' : 'Vamos a repasar'));
    return { marks, ok, n, nota, label, stars: nota >= 9 ? 3 : (nota >= 7 ? 2 : (nota >= 5 ? 1 : 0)), wrong: rows.filter((_, i) => !marks[i]) };
  }

  /* ---------- minijuego «El tren» ---------- */
  // Enganchar los vagones en orden: del más pequeño al más grande (o al revés).
  function makeOrderGame(r, skill, rounds) {
    const def = SK[skill];
    const lo = def.max > 10 ? 8 : 0, hi = def.max > 10 ? 20 : (def.max === 5 ? 5 : 10);
    const out = [];
    for (let k = 0; k < (rounds || 3); k++) {
      const n = def.max === 5 ? 4 : (k === 0 ? 4 : 5);
      const all = shuffle(r, Array.from({ length: hi - lo + 1 }, (_, i) => lo + i));
      // la última ronda de las lecciones más avanzadas va hacia atrás
      const desc = k === (rounds || 3) - 1 && skillIndex(skill) >= skillIndex('more1');
      out.push({ numbers: all.slice(0, n), desc });
    }
    return out;
  }

  /* ---------- minijuego «Dominó de dobles» ---------- */
  function makeDominoGame(r, skill, rounds) {
    const hi = skill === 'add20' ? 9 : (skill === 'near' ? 4 : 5), lo = skill === 'add20' ? 5 : 1;
    const ns = shuffle(r, Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)).slice(0, rounds || 3);
    return ns.map((n) => {
      const others = shuffle(r, [n - 1, n + 1, n + 2, n - 2].filter((v) => v >= 1 && v <= 10 && v !== n)).slice(0, 2);
      return { n, halves: shuffle(r, [n].concat(others)), sum: 2 * n, options: makeOptions(r, 2 * n, 2, 20, [n, 2 * n - 1]) };
    });
  }

  /* ---------- minijuego «La tienda de Pipa» ---------- */
  // Pagar un precio justo con monedas de 1, 2, 5 y 10 (composición del número).
  function shopMax(skill) { return SK[skill].max > 10 ? 20 : (skill === 'sub5' || skill === 'bond5' ? 5 : 10); }
  function minCoins(price) { let n = 0, left = price; for (const c of [10, 5, 2, 1]) { n += Math.floor(left / c); left %= c; } return n; }
  function makeShopGame(r, skill, rounds) {
    const mx = shopMax(skill), lo = mx > 10 ? 11 : 3;
    const out = [];
    let guard = 0;
    while (out.length < (rounds || 3) && guard++ < 300) {
      const price = ri(r, lo, mx);
      if (out.some((x) => x.price === price)) continue;
      out.push({ price, coins: mx > 10 ? [10, 5, 2, 1] : [5, 2, 1], minCoins: minCoins(price) });
    }
    return out;
  }

  /* ---------- minijuego «La balanza» ---------- */
  // Los dos platos deben pesar lo mismo: 8 = 5 + ?  ·  4 + 3 = 5 + ?  (el «=» como equilibrio)
  function makeBalanceGame(r, skill, rounds) {
    const def = SK[skill];
    const hi = def.max > 10 ? 18 : (def.max === 5 ? 5 : 10);
    const lo = def.max > 10 ? 11 : (def.max === 5 ? 3 : 5);
    const simple = ['sub5', 'compare', 'sub10', 'bond5', 'bond10', 'from10', 'bondN', 'more1'].includes(skill);
    const out = [];
    let guard = 0;
    while (out.length < (rounds || 3) && guard++ < 400) {
      const T = skill === 'bond10' || skill === 'from10' ? 10 : ri(r, lo, hi);
      const c = ri(r, 1, Math.min(T - 1, 10));
      const answer = T - c;
      if (answer < 1 || answer > 10) continue;
      let left = [T];
      if (!simple) {
        const a = ri(r, 1, Math.min(T - 1, 10));
        if (T - a > 10 || a === c || T - a === c) continue;
        left = [a, T - a];
      }
      if (out.some((x) => x.right[0] === c && x.total === T)) continue;
      out.push({ total: T, left, right: [c], answer, options: makeOptions(r, answer, 0, Math.min(10, T), [c, T > 10 ? T - 10 : T]) });
    }
    return out;
  }

  /* ---------- minijuego «Memoria» ---------- */
  // Tarjetas boca abajo: encontrar las dos que van juntas (hecho y resultado, parejas del 10, dibujo y número).
  function makeMemoryGame(r, skill) {
    let pairs = [], rule = 'same';
    const num = (v) => ({ t: 'num', v }), ex = (text, v) => ({ t: 'expr', text, v }), dots = (v) => ({ t: 'dots', v });
    if (['sub5', 'compare', 'sub10'].includes(skill)) {
      const lo = skill === 'sub5' ? 1 : 4, hi = skill === 'sub5' ? 5 : 10;
      pairs = shuffle(r, Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)).slice(0, 4).map((n) => [dots(n), num(n)]);
    } else if (skill === 'bond5' || skill === 'bond10' || skill === 'from10') {
      const T = skill === 'bond5' ? 5 : 10;
      rule = 'sum' + T;
      const cands = [];
      for (let a = (T === 5 ? 0 : 1); a < T / 2; a++) cands.push([num(a), num(T - a)]);
      pairs = shuffle(r, cands).slice(0, 4);
    } else if (skill === 'dbl') {
      pairs = shuffle(r, [1, 2, 3, 4, 5]).slice(0, 4).map((n) => [ex(n + ' + ' + n, 2 * n), num(2 * n)]);
    } else {
      const sub = skill === 'sub10t';
      const seen = new Set();
      let guard = 0;
      while (pairs.length < 4 && guard++ < 300) {
        const v = ri(r, sub ? 1 : 4, sub ? 8 : 10);
        if (seen.has(v)) continue;
        const a = sub ? ri(r, v + 2, 10) : ri(r, 2, v - 2);
        if (a < 1 || a > 10 || (sub ? a - v < 1 : v - a < 1)) continue;
        seen.add(v);
        pairs.push([sub ? ex(a + ' − ' + (a - v), v) : ex(a + ' + ' + (v - a), v), num(v)]);
      }
    }
    const cards = [];
    pairs.forEach((pr, i) => pr.forEach((face) => cards.push({ pair: i, face })));
    return { rule, pairs: pairs.length, cards: shuffle(r, cards).map((c, i) => Object.assign({ id: i }, c)) };
  }

  /* ---------- reto final (prueba de dominio) ---------- */
  // Muchas operaciones seguidas en el nivel «Pensar», cubriendo todo el conjunto de la
  // lección; las falladas vuelven al final hasta que se aciertan (con un tope para que
  // siempre termine). Sin cronómetro.
  function makeChallenge(skill, seed) {
    const r = makeRng((seed >>> 0) || 1);
    const st = newState(seed, { level: 2 });
    const n = challengeSize(skill);
    const P = pool(st, skill, false, true);
    // Orden: todas las operaciones del conjunto antes de repetir ninguna
    const specs = [];
    let bag = [];
    let guard = 0;
    while (specs.length < n && guard++ < 1000) {
      if (!bag.length) bag = shuffle(r, P);
      let i = bag.findIndex((p) => !specs.length || p.key !== specs[specs.length - 1].key);
      if (i < 0) i = 0;
      specs.push(bag.splice(i, 1)[0]);
    }
    const items = specs.map((spec) => {
      const it = makeItem(st, skill, { r, level: 2, spec, mode: 'challenge' });
      st.skills[skill].lastKind = it.kind;
      return it;
    });
    return { skill, n, items, queue: items.slice(), phase: 'main', results: [], review: [], reviewFails: 0, rng: r, st };
  }
  // Siguiente ejercicio, o null si se ha terminado. Avisa del paso al repaso con ch.enteringReview.
  function challengeNext(ch) {
    ch.enteringReview = false;
    if (ch.queue.length) return ch.queue.shift();
    if (ch.review.length) {
      if (ch.phase === 'main') { ch.phase = 'review'; ch.enteringReview = true; }
      const entry = ch.review.shift();
      // misma operación, presentada de nuevo (puede cambiar el tipo de actividad)
      const it = makeItem(ch.st, ch.skill, { r: ch.rng, level: 2, spec: entry.spec, mode: 'challenge' });
      it.reviewEntry = entry;
      return it;
    }
    return null;
  }
  function challengeRecord(ch, it, res) {
    const ok = !!(res.correct && res.firstTry && !res.hint);
    const spec = it.spec;
    if (ch.phase === 'main') {
      ch.results.push({ key: spec.key, text: solvedText(it) || String(it.answer), kind: it.kind, ok, correct: !!res.correct, hint: !!res.hint });
      if (!ok) ch.review.push({ spec, fails: 0 });
    } else {
      // en el repaso cuenta acertar a la primera (puede pedir el dibujo)
      const entry = it.reviewEntry || { spec, fails: 0 };
      if (!(res.correct && res.firstTry)) {
        ch.reviewFails++;
        entry.fails++;
        if (entry.fails < CHALLENGE_REVIEW_MAX) ch.review.push(entry);
      }
    }
    return ok;
  }
  function challengeResult(ch) {
    const n = ch.results.length;
    const firstOk = ch.results.filter((x) => x.ok).length;
    const needed = Math.ceil(CHALLENGE_PASS * ch.n - 1e-9);
    const missed = ch.results.filter((x) => !x.ok);
    const passed = n >= ch.n && firstOk >= needed && ch.reviewFails === 0;
    return { n, total: ch.n, firstOk, needed, pct: n ? firstOk / n : 0, passed, reviewFails: ch.reviewFails, missed: missed.map((x) => x.text), helped: missed.filter((x) => x.correct && x.hint).length };
  }

  // Dados: 'count' (un dado, cuántos puntos), 'double' (dobles), 'add' (suma ≤ 10), 'big' (suma > 10)
  function makeDiceGame(r, mode, rounds) {
    const out = [];
    let guard = 0;
    while (out.length < (rounds || 5) && guard++ < 500) {
      let d1 = ri(r, 1, mode === 'double' ? 5 : 6), d2 = mode === 'double' ? d1 : ri(r, 1, 6);
      if (mode === 'count') d2 = 0;
      const sum = d1 + d2;
      if (mode === 'add' && (sum > 10 || d2 === 0)) continue;
      if (mode === 'big' && sum <= 10) continue;
      if (out.length && out[out.length - 1].d1 === d1 && out[out.length - 1].d2 === d2) continue;
      out.push({ d1, d2, sum, options: makeOptions(r, sum, mode === 'count' ? 1 : 2, mode === 'count' ? 6 : 12, [Math.max(d1, d2)]) });
    }
    return out;
  }
  // Burbujas: "tengo 7, ¿qué burbuja completa el 10?"
  function makeBubblesGame(r, T, rounds) {
    const out = [];
    let guard = 0;
    while (out.length < (rounds || 5) && guard++ < 500) {
      const a = ri(r, 1, T - 1);
      if (out.length && out[out.length - 1].a === a) continue;
      const ans = T - a;
      const s = new Set([ans]);
      const cands = shuffle(r, [ans + 1, ans - 1, a, ans + 2, ans - 2, T].filter((v) => v >= 0 && v <= T && v !== ans));
      for (const v of cands) { if (s.size >= 4) break; s.add(v); }
      while (s.size < 4) s.add(ri(r, 0, T));
      out.push({ a, ans, T, bubbles: shuffle(r, Array.from(s)) });
    }
    return out;
  }

  /* ---------- minijuego «Moscas para Pipa» ---------- */
  // Pipa tiene un número en la barriga; entre las moscas, hay que cazar todas las que
  // valen lo mismo (7 + 3, 6 + 4… si el número es 10). Trabaja el significado de «=».
  function fliesDomain(skill) {
    if (['sub5', 'sub10', 'compare'].includes(skill)) return { kind: 'dots', lo: skill === 'sub5' ? 2 : 4, hi: skill === 'sub5' ? 5 : 9 };
    if (['add20', 'sub20', 'teen', 'teen2', 'mix20'].includes(skill)) return { kind: 'expr', lo: 11, hi: 16, sub: skill !== 'add20' && skill !== 'teen' };
    if (['from10', 'sub10t', 'mix10'].includes(skill)) return { kind: 'expr', lo: 3, hi: 9, sub: true };
    return { kind: 'expr', lo: 5, hi: 10, sub: false };
  }
  function exprsFor(r, t, withSub, max) {
    const out = [];
    for (let a = 0; a <= t; a++) { const b = t - a; if (a >= 1 && b >= 1 && a <= 10 && b <= 10) out.push({ text: a + ' + ' + b, value: t }); }
    if (withSub) for (let b = 1; b <= 9; b++) { const a = t + b; if (a <= max) out.push({ text: a + ' − ' + b, value: t }); }
    return shuffle(r, out);
  }
  function makeFliesGame(r, skill, rounds) {
    const D = fliesDomain(skill);
    const out = [];
    let lastT = null, guard = 0;
    while (out.length < (rounds || 3) && guard++ < 200) {
      const t = ri(r, D.lo, D.hi);
      if (t === lastT) continue;
      lastT = t;
      const flies = [];
      if (D.kind === 'dots') {
        const others = shuffle(r, [t - 1, t + 1, t + 2, t - 2, t - 3].filter((v) => v >= 1 && v <= (skill === 'sub5' ? 5 : 10) && v !== t)).slice(0, 3);
        [t, t, t].forEach(() => flies.push({ dots: t, value: t, ok: true }));
        others.forEach((v) => flies.push({ dots: v, value: v, ok: false }));
      } else {
        const max = D.hi > 10 ? 20 : 10;
        const good = exprsFor(r, t, D.sub, max);
        good.slice(0, 3).forEach((e) => flies.push(Object.assign({ ok: true }, e)));
        const bad = [];
        [t - 1, t + 1, t + 2, t - 2].filter((v) => v >= 2 && v <= max).forEach((v) => { const e = exprsFor(r, v, D.sub, max)[0]; if (e) bad.push(e); });
        shuffle(r, bad).slice(0, 3).forEach((e) => flies.push(Object.assign({ ok: false }, e)));
      }
      out.push({ target: t, flies: shuffle(r, flies) });
    }
    return out;
  }

  /* ---------- juegos de parejas ---------- */
  function makePairsGame(r, T) {
    const pairs = [];
    for (let a = 1; a <= Math.floor(T / 2); a++) pairs.push([a, T - a]);
    let chosen = shuffle(r, pairs).slice(0, 4);
    while (chosen.length < 4) chosen.push(pick(r, pairs));
    const cards = shuffle(r, chosen.flat().map((v, i) => ({ id: i, v })));
    return { target: T, cards };
  }
  function pairsSolvable(cards, T) {
    const cnt = {};
    cards.forEach((c) => (cnt[c.v] = (cnt[c.v] || 0) + 1));
    for (const v in cnt) {
      const n = Number(v);
      if (n * 2 === T) { if (cnt[v] % 2) return false; }
      else if ((cnt[T - n] || 0) !== cnt[v]) return false;
    }
    return true;
  }
  function makeMatchGame(r, max) {
    const lo = max === 5 ? 1 : 5;
    const nums = shuffle(r, Array.from({ length: max - lo + 1 }, (_, i) => lo + i)).slice(0, 4);
    const cards = [];
    nums.forEach((n) => { cards.push({ v: n, t: 'dots' }); cards.push({ v: n, t: 'num' }); });
    return { cards: shuffle(r, cards).map((c, i) => Object.assign({ id: i }, c)) };
  }

  /* ---------- evaluación inicial ---------- */
  function makeDiagnostic(st) {
    const r = makeRng(st.seed ^ 0xA5A5);
    const mk = (skill, kind, spec, level, extra) => {
      const it = makeItem(st, skill, { r, level, kind });
      Object.assign(it, spec);
      // recalcular respuesta y opciones con los datos fijados
      if (it.op === 'n') { it.c = it.a; it.answer = it.a; it.key = 'n' + it.a; it.options = makeOptions(r, it.answer, 1, it.cap === 5 ? 6 : 10, []); }
      if (it.op === 'bond') { it.b = it.total - it.have; it.a = it.have; it.c = it.total; it.answer = it.b; it.key = bondKey(it.have, it.total); it.cap = it.total <= 5 ? 5 : 10; it.options = makeOptions(r, it.answer, 0, it.total, [it.have, it.total]); }
      if (it.op === '+') { it.c = it.a + it.b; it.answer = it.c; it.key = it.a + '+' + it.b; it.format = 'a+b=?'; it.options = makeOptions(r, it.answer, 0, 10, [Math.max(it.a, it.b)]); }
      if (it.op === '-') { it.c = it.a - it.b; it.answer = it.c; it.key = it.a + '-' + it.b; it.format = 'c-b=?'; it.options = makeOptions(r, it.answer, 0, 10, [it.b]); }
      it.hint = strategyFor(it.op === 'bond' ? { op: 'bond', a: it.have, b: it.answer, c: it.total } : it);
      it.mode = 'diag'; it.diag = extra; it.pic = false;
      return it;
    };
    return [
      mk('sub5', 'quick', { a: 3, flash: 2500, pattern: 'dice' }, 1, 'q3'),
      mk('sub5', 'quick', { a: 5, flash: 2500, pattern: 'frame' }, 1, 'q5'),
      mk('sub5', 'quick', { a: 4, flash: 2500, pattern: 'frame' }, 1, 'q4'),
      mk('sub10', 'quick', { a: 7, flash: 2500, pattern: 'frame' }, 1, 'q7'),
      mk('sub10', 'quick', { a: 9, flash: 2500, pattern: 'frame' }, 1, 'q9'),
      mk('sub10', 'quick', { a: 6, flash: 2500, pattern: 'frame' }, 1, 'q6'),
      mk('bond5', 'hidden', { have: 3, total: 5 }, 1, 'h5'),
      mk('bond10', 'hidden', { have: 7, total: 10 }, 1, 'h10'),
      mk('addon', 'choose', { a: 2, b: 1 }, 2, 'a21'),
      mk('addon', 'choose', { a: 3, b: 2 }, 2, 'a32'),
      mk('addon', 'choose', { a: 5, b: 2 }, 2, 'a52'),
      mk('sub10t', 'choose', { a: 5, b: 2 }, 2, 's52'),
      mk('sub10t', 'choose', { a: 8, b: 3 }, 2, 's83'),
    ];
  }
  // «¿Por dónde empiezo?»: recomienda una lección a partir de unas pocas preguntas.
  // results: [{tag, correct, firstTry, hint}]
  function recommendLesson(results) {
    const R = {};
    results.forEach((x) => (R[x.tag] = x));
    const ind = (t) => !!(R[t] && R[t].correct && R[t].firstTry && !R[t].hint);
    const cnt = (tags) => tags.filter(ind).length;
    const q5 = cnt(['q3', 'q5', 'q4']), q10 = cnt(['q7', 'q9', 'q6']);
    const add = cnt(['a21', 'a32', 'a52']), sub = cnt(['s52', 's83']);
    let skill = 'add10';
    if (q5 < 3) skill = 'sub5';
    else if (q10 < 2) skill = 'sub10';
    else if (!ind('h5')) skill = 'bond5';
    else if (!ind('h10')) skill = 'bond10';
    else if (!ind('a21')) skill = 'more1';
    else if (add < 3) skill = 'addon';
    else if (sub < 2) skill = 'from10';
    return { skill, detail: { q5: q5 + '/3', q10: q10 + '/3', bond5: ind('h5'), bond10: ind('h10'), add: add + '/3', sub: sub + '/2' } };
  }

      return w;
    }
    if (it.story && it.story.compare) {
      // dos filas alineadas: se ve cuántas más tiene Pipa (correspondencia uno a uno)
      const e = it.story.obj.e;
      const row = (who, n, extra) => {
        const r = h('div', { class: 'cmprow' }, h('span', { class: 'who' }, who));
        for (let i = 0; i < n; i++) r.appendChild(h('span', { class: 'it' + (extra && i >= it.b ? ' more' : '') }, e));
        if (!extra) for (let i = n; i < it.a; i++) r.appendChild(h('span', { class: 'it gap' }, ''));
        return r;
      };
      return h('div', { class: 'cmpstory' }, row('🐸', it.a, true), row(it.story.friend.e, it.b, false));
    }
    const e = it.story.obj.e;
    const w = h('div', { class: 'emojis' });
    if (it.op === 'bond') {
      for (let i = 0; i < it.have; i++) w.appendChild(h('span', null, e));
      for (let i = 0; i < it.total - it.have; i++) w.appendChild(h('span', { class: 'b q' }, '❔'));
    } else if (it.op === '+') {
      for (let i = 0; i < it.a; i++) w.appendChild(h('span', null, e));
      for (let i = 0; i < it.b; i++) w.appendChild(h('span', { class: 'b' }, e));
    } else {
      for (let i = 0; i < it.a; i++) w.appendChild(h('span', { class: i >= it.c ? 'x' : '' }, e));

  }
  function Eq(txt, cls) {
    const el = h('div', { class: 'eq ' + (cls || '') });
    function paint(t, fill, typing) {
      el.innerHTML = '';
      t.split(' ').forEach((tok) => {
        if (tok === '?') el.appendChild(h('span', { class: 'q' + (typing ? ' typing' : (fill != null ? ' filled' : '')) }, fill != null ? String(fill) : ''));
        else if (tok === '+' || tok === '−' || tok === '=') el.appendChild(h('span', { class: 'op' }, tok));
        else el.appendChild(h('span', null, tok));
      });
    }
    paint(txt);
    return { el, fill: (v) => paint(txt, v), type: (v) => paint(txt, v === '' ? null : v, true) };
  }

  /* ---------- carcasa de actividad y flujo de respuesta ---------- */
  function Shell(promptTxt, sub) {
    const prompt = h('div', { class: 'prompt' }, promptTxt, sub ? h('span', { class: 'sub' }, sub) : null);
    const stage = h('div', { class: 'stage' });
    const answers = h('div', { class: 'answers' });
    const msg = h('div', { class: 'msg', 'aria-live': 'polite' });
    const tools = h('div', { class: 'tools' });
    const left = h('div', { class: 'left' }, prompt, stage);
    const right = h('div', { class: 'right' }, answers, msg, tools);
    const root = h('div', { class: 'act' }, left, right);
    return { root, prompt, stage, answers, msg, tools, left, right };
  }
  function setMsg(sh, txt, cls) { sh.msg.className = 'msg ' + (cls || ''); sh.msg.textContent = txt; }

  // Flujo común: elegir entre opciones. Siempre permite reintentar; al 2.º fallo enseña la solución.
  function optionFlow(sh, it, cfg) {
    const st = { tries: cfg.priorTries || 0, hint: !!cfg.priorHint, done: false };
    sh.answers.innerHTML = '';
    const btns = it.options.map((v) => {
      const b = cfg.makeButton ? cfg.makeButton(v) : h('button', { class: 'opt', 'aria-label': 'Respuesta ' + v }, String(v));
      b.dataset.v = String(v);
      b.addEventListener('click', () => choose(v, b));
      return b;
    });
    btns.forEach((b) => (cfg.container || sh.answers).appendChild(b));
    const t0 = Date.now();
    function choose(v, b) {
      if (st.done) return;
      st.tries++;
      if (st.tries === 1) st.ms = Date.now() - t0;
      if (C.checkAnswer(it, v)) {
        st.done = true; b.classList.add('right'); Fx.good(); sparkle(b);
        const p = praise();
        setMsg(sh, p, 'good');
        cfg.onRight && cfg.onRight();
        const extra = cfg.explainRight ? cfg.explainRight() : '';
        if (extra) setMsg(sh, p + ' ' + extra, 'good');
        // en los guiados se dice la explicación; en el resto basta con felicitar (avance rápido)
        Voice.say(CUR.guided || cfg.auto ? p + ' ' + extra : p);
        finishBtn(sh, { correct: true, firstTry: st.tries === 1, hint: st.hint, tries: st.tries, ms: st.ms }, cfg, it);
      } else {
        b.classList.add('wrong'); b.disabled = true; Fx.soft();
        if (st.tries === 1) {
          const diag = C.diagnoseError(it, v);
          const special = diag ? diag.text : (cfg.wrongText ? cfg.wrongText(v) : '');
          const t = diag || cfg.plainWrong ? '' : retryText();
          setMsg(sh, (t + (special ? ' ' + special : '')).trim(), 'try');
          cfg.onFirstWrong && cfg.onFirstWrong(v);
          // en voz: la versión hablada de la pista (sin signos)
          const spoken = diag ? diag.say : (special && it.hint && special === it.hint.text ? it.hint.say : (special ? C.exprSpeech(special) : (it.hint ? it.hint.say : '')));
          Voice.say((t + ' ' + spoken).trim());
        } else {
          st.done = true;
          const ok = btns.find((x) => Number(x.dataset.v) === it.answer);
          ok && ok.classList.add('reveal');
          cfg.onSolution && cfg.onSolution();
          const st0 = C.solvedText(it);
          const sol = cfg.solutionSay ? cfg.solutionSay() : (st0 ? 'Mira: ' + eqSay(st0) + '.' : 'Es el ' + it.answer + '.');
          setMsg(sh, 'Mira, es ' + it.answer + '. ¡La próxima lo sacas!', 'try');
          const okBtn = btns.find((x) => Number(x.dataset.v) === it.answer); if (okBtn) okBtn.disabled = true;
          btns.forEach((x) => (x.disabled = true));
          Voice.say('No pasa nada. ' + sol);
          finishBtn(sh, { correct: false, firstTry: false, hint: st.hint, tries: st.tries, ms: st.ms }, cfg, it);
        }
      }
    }
    return { useHint() { st.hint = true; }, state: st };
  }
  // Botón de seguir (y barra opcional para que el adulto indique la estrategia)
  function finishBtn(sh, result, cfg, it) {
    sh.tools.innerHTML = '';
    let gone = false;
    const go = (strat) => { if (gone) return; gone = true; cfg.done(Object.assign({}, result, { strat: strat || null })); };
    if (cfg.auto) { CUR.timers.push(setTimeout(() => go(null), result.correct ? 1300 : 3000)); return; }
    if (S.settings.companion && it && ['+', '-', 'bond'].includes(it.op) && result.correct && !CUR.challenge) {
      const bar = h('div', { class: 'adultbar' }, h('div', { class: 'lbl' }, 'Para el adulto: ¿cómo lo ha resuelto?'),
        h('div', { class: 'row' },
          h('button', { onclick: () => go('all') }, '🖐️ Contando todo desde 1'),
          h('button', { onclick: () => go('on') }, '➡️ Contando desde un número'),
          h('button', { onclick: () => go('known') }, '💡 Lo sabía / lo razonó'),
          h('button', { onclick: () => go(null) }, 'No lo sé')));
      sh.tools.appendChild(bar);
    } else if (result.correct) {
      // acierto: avance automático tras la felicitación (sin botón que tocar)
      const t = setTimeout(() => go(null), CUR.guided || (it && it.kind === 'talk') ? 2600 : 1300);
      CUR.timers.push(t);
    } else {
      // tras un error, que mire la solución con calma
      sh.tools.appendChild(h('button', { class: 'btn primary big continue', onclick: () => { Voice.stop(); go(null); } }, 'Seguir ➜'));
    }
  }
  // Teclado de números: escribir el resultado, como en el cuaderno de clase
  function NumPad(cb) {
    const el = h('div', { class: 'numpad', role: 'group', 'aria-label': 'Teclado de números' });
    [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach((d) => el.appendChild(h('button', { class: 'key', 'data-k': String(d), 'aria-label': String(d), onclick: () => cb.digit(String(d)) }, String(d))));
    el.appendChild(h('button', { class: 'key del', 'data-k': 'del', 'aria-label': 'Borrar', onclick: () => cb.del() }, '⌫'));
    el.appendChild(h('button', { class: 'key ok', 'data-k': 'ok', 'aria-label': 'Listo', onclick: () => cb.ok() }, '✔'));
    return el;
  }
  // Igual que optionFlow, pero escribiendo: reintento con pista concreta y, al 2.º fallo, la solución.
  function padFlow(sh, it, cfg) {
    const st = { tries: 0, hint: false, done: false };
    let cur = '';
    const pad = NumPad({
      digit: (d) => { if (st.done) return; if (cur.length >= 2) cur = ''; cur += d; cfg.show(cur); Fx.tap(); },
      del: () => { if (st.done) return; cur = cur.slice(0, -1); cfg.show(cur); },
      ok: () => { if (st.done || cur === '') { if (!st.done) Voice.say('Primero escribe el número.'); return; } submit(Number(cur)); },
    });
    sh.answers.innerHTML = ''; sh.answers.appendChild(pad);
    const t0 = Date.now();
    function submit(v) {
      st.tries++;
      if (st.tries === 1) st.ms = Date.now() - t0;
      if (C.checkAnswer(it, v)) {
        st.done = true; pad.classList.add('off'); Fx.good(); sparkle(sh.prompt.querySelector('.q') || sh.prompt);
        const p = praise();
        cfg.onRight && cfg.onRight();
        const extra = cfg.explainRight ? cfg.explainRight() : '';
        setMsg(sh, (p + ' ' + extra).trim(), 'good');
        Voice.say(CUR.guided ? p + ' ' + extra : p);
        finishBtn(sh, { correct: true, firstTry: st.tries === 1, hint: st.hint, tries: st.tries, ms: st.ms }, cfg, it);
      } else if (st.tries === 1) {
        Fx.soft(); pad.classList.remove('shake'); void pad.offsetWidth; pad.classList.add('shake');
        const diag = C.diagnoseError(it, v);
        const text = diag ? diag.text : (retryText() + ' ' + (it.hint ? it.hint.text : ''));
        setMsg(sh, text.trim(), 'try');
        cfg.onFirstWrong && cfg.onFirstWrong(v);
        Voice.say(diag ? diag.say : (retryText() + ' ' + (it.hint ? it.hint.say : '')));
        cur = ''; cfg.show('');
      } else {
        st.done = true; pad.classList.add('off'); Fx.soft();
        cfg.onSolution && cfg.onSolution();
        const st0 = C.solvedText(it);
        const sol = cfg.solutionSay ? cfg.solutionSay() : (st0 ? 'Mira: ' + eqSay(st0) + '.' : 'Es el ' + it.answer + '.');
        setMsg(sh, 'Mira, es ' + it.answer + '. ¡La próxima lo sacas!', 'try');
        Voice.say('No pasa nada. ' + sol);
        finishBtn(sh, { correct: false, firstTry: false, hint: st.hint, tries: st.tries, ms: st.ms }, cfg, it);
      }
    }
    return { useHint() { st.hint = true; }, state: st };
  }
  function hintButton(sh, label, fn) {
    const b = h('button', { class: 'btn small', onclick: () => { fn(); b.remove(); } }, label || '💡 Ayuda');
    sh.tools.appendChild(b);
    return b;
  }

  /* ---------- actividades ---------- */
  const ACT = {};

  // Mirada rápida (subitización)
  ACT.quick = function (it, sh, done, ctx) {
    sh.prompt.textContent = '¿Cuántas fichas hay?';
    const peek = h('div', { class: 'peek' });
    sh.stage.appendChild(peek);
    let flow = null, looks = 0;
    const look = async () => {
      looks++;

      if (it.flash > 0) {
        await wait(it.flash);
        peek.appendChild(h('div', { class: 'cloud' }, '☁️'));
      }
      if (!flow) {
        sh.tools.innerHTML = '';
        flow = optionFlow(sh, it, {
          done,
          onFirstWrong: () => { if (it.flash > 0 && !NOAUTO) { const c = peek.querySelector('.cloud'); c && c.remove(); } },
          onRight: () => { const c = peek.querySelector('.cloud'); c && c.remove(); },
          onSolution: () => { const c = peek.querySelector('.cloud'); c && c.remove(); },
          explainRight: () => it.a > 5 ? ('Son ' + it.a + ': cinco y ' + (it.a - 5) + '.') : ('Son ' + it.a + '.'),
          wrongText: () => it.hint.text,
        });
        if (it.flash > 0) {
          sh.tools.appendChild(h('button', { class: 'btn small', onclick: () => { flow.useHint(); look(); } }, '🔁 Mirar otra vez'));
        }
      } else if (looks > 1) {

        Array.from(sh.tools.querySelectorAll('button')).slice(0, -1).forEach((b) => b.remove());
      }
    };
    if (it.flash > 0) {
      const btn = h('button', { class: 'btn blue big', onclick: () => { btn.remove(); look(); } }, '👀 ¡Mirar!');
      peek.appendChild(btn);
      Voice.say(ctx.guided ? 'Mira bien las fichas. Busca grupos, como el cinco. Pulsa mirar.' : 'Pulsa mirar y dime cuántas fichas hay.');
    } else {
      look();
      Voice.say('¿Cuántas fichas hay? ' + (it.a > 5 ? 'Busca la fila de cinco.' : ''));
    }
  };

  // Poner N fichas
  ACT.build1 = function (it, sh, done) {
    const n = it.a, cap = it.cap;
    sh.prompt.innerHTML = '';
    sh.prompt.appendChild(document.createTextNode('Pon '));
    sh.prompt.appendChild(h('span', { style: { fontSize: '56px', color: 'var(--blue)' } }, String(n)));
    sh.prompt.appendChild(document.createTextNode(n === 1 ? ' ficha' : ' fichas'));
    let count = 0, tries = 0, finished = false;
    const fr = Frames(cap, cellsFor(cap, []), {
      onTap: (idx) => {
        if (finished) return;
        const cur = fr.get();
        if (cur[idx] === 'a' && idx === count - 1) count--; // quitar la última
        else if (cur[idx] === 'a') count--; else if (count < cap) count++;
        Fx.tap();
        fr.set(cellsFor(cap, [['a', count]]));
      },
    });
    sh.stage.appendChild(fr.el);
    sh.stage.appendChild(h('div', { class: 'muted' }, 'Toca el marco para poner una ficha. Toca una ficha para quitarla.'));
    const ok = h('button', { class: 'btn primary big', onclick: check }, '✔ ¡Listo!');
    sh.answers.appendChild(ok);
    Voice.say((n === 1 ? 'Pon una ficha' : 'Pon ' + n + ' fichas') + ' en el marco. Cuando termines, pulsa listo.');
    function check() {
      if (finished) return;
      tries++;
      if (count === n) {
        finished = true; ok.remove(); Fx.good();
        const p = praise();
        const ex = n > 5 ? (n === 10 ? 'Diez: ¡todo lleno!' : n + ' es cinco y ' + (n - 5) + '.') : '';
        setMsg(sh, p + ' ' + ex, 'good'); Voice.say(p + ' ' + ex);
        finishBtn(sh, { correct: true, firstTry: tries === 1, hint: false, tries }, { done }, it);
      } else if (tries === 1) {
        const t = count > n ? 'Mmm, creo que hay demasiadas. ¡Cuéntalas otra vez!' : 'Mmm, creo que faltan. ¡Cuéntalas otra vez!';
        setMsg(sh, t, 'try'); Voice.say(t + (n > 5 ? ' Recuerda: una fila llena son cinco.' : ''));
      } else {
        finished = true; ok.remove(); count = n; fr.set(cellsFor(cap, [['a', n]]));
        const t = 'Mira, así son ' + n + '.' + (n > 5 && n < 10 ? ' Cinco y ' + (n - 5) + '.' : '');
        setMsg(sh, t, 'try'); Voice.say('No pasa nada. ' + t);
        finishBtn(sh, { correct: false, firstTry: false, hint: false, tries }, { done }, it);
      }
    }
  };

  // Construir una suma con fichas de dos colores
  ACT.build = function (it, sh, done, ctx) {
    const cap = it.cap, a = it.a, b = it.b;
    const eq = Eq(C.exprText(it));
    sh.prompt.innerHTML = ''; sh.prompt.appendChild(eq.el);
    let na = 0, nb = 0, phase = 'a';
    const fr = Frames(cap, cellsFor(cap, []), { onTap: tap });
    const info = h('div', { class: 'coach' });
    sh.stage.appendChild(info); sh.stage.appendChild(fr.el);
    const say = () => {
      const az = (n) => n === 1 ? 'una ficha azul' : n + ' fichas azules', na = (n) => n === 1 ? 'una ficha naranja' : n + ' fichas naranjas';
      if (phase === 'a') { info.textContent = 'Pon ' + az(a) + ' 🔵'; Voice.say('Primero pon ' + az(a) + '.'); }
      else if (phase === 'b') { info.textContent = 'Ahora ' + na(b) + ' ⭐'; Voice.say('Ahora pon ' + na(b) + '.'); }
    };
    say();
    function paint() { fr.set(cellsFor(cap, [['a', na], ['b', nb]])); }
    function tap(idx) {
      const cur = fr.get();
      if (phase === 'a') {
        if (cur[idx] === 'a') { na--; paint(); return; }
        na++; paint(); Fx.tap();
        if (na === a) { phase = 'b'; setTimeout(say, 250); }
      } else if (phase === 'b') {
        if (cur[idx] === 'b') { nb--; paint(); return; }
        if (cur[idx] === 'a') return;
        nb++; paint(); Fx.tap();
        if (nb === b) { phase = 'q'; ask(); }
      }
    }
    function ask() {
      info.textContent = '¿Cuántas hay en total?';
      Voice.say('¿Cuántas fichas hay en total?' + (ctx.guided ? ' ' + it.hint.say : ''));
      optionFlow(sh, it, {
        done,
        onRight: () => { eq.fill(it.answer); addFlip(); },
        onSolution: () => eq.fill(it.answer),
        explainRight: () => eqSay(C.solvedText(it)) + '.' + (it.c > 10 && it.a < 10 ? ' Primero llenamos el diez.' : ''),
        wrongText: () => it.hint.text,
      });
    }
    function addFlip() {
      if (a === b || cap !== 10) return;
      const fb = h('button', { class: 'btn small orange', onclick: () => {
        fb.remove();
        fr.set(cellsFor(cap, [['b', b], ['a', a]]));
        const t = b + ' + ' + a + ' = ' + it.c;
        info.textContent = 'Al revés: ' + t;
        Voice.say('Y al revés: ' + eqSay(t) + '. ¡El mismo resultado!');
      } }, '🔄 ¿Y al revés?');
      sh.stage.appendChild(fb);
    }
  };

  // Completar el marco (parejas)
  ACT.fill = function (it, sh, done, ctx) {
    const T = it.total, have = it.have, cap = it.cap;
    sh.prompt.innerHTML = '';
    sh.prompt.appendChild(document.createTextNode('Tenemos ' + have + '. ¡Llena el ' + T + '!'));
    let added = new Set();
    const base = () => { const c = cellsFor(cap, [['a', have]]); added.forEach((i) => (c[i] = 'b')); return c; };
    let phase = 'fill';
    const fr = Frames(cap, base(), {
      onTap: (idx) => {
        if (phase !== 'fill' || idx < have || idx >= T) return;
        if (added.has(idx)) added.delete(idx); else { added.add(idx); Fx.tap(); }
        fr.set(base());
        if (added.size === T - have) { phase = 'q'; setTimeout(ask, 300); }
      },
    });

    const coach = h('div', { class: 'coach' }, 'Toca los huecos vacíos');

  // Fichas escondidas en la caja
  ACT.hidden = function (it, sh, done, ctx) {

    const wrap = h('div', { class: 'hide-wrap' }, loose, chest);

      await wait(1100);

        const k = i - have, el = ctrs[i], cr = el.getBoundingClientRect();

          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.45)', opacity: 0.9, offset: 0.97 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.3)', opacity: 0, offset: 1 },

        setTimeout(() => { if (chest.isConnected) { Fx.pop(); chest.classList.remove('gulp'); void chest.offsetWidth; chest.classList.add('gulp'); } }, k * 150 + 470);
      }

      if (!chest.isConnected) return;
      for (let i = have; i < T; i++) ctrs[i].style.visibility = 'hidden';
      chest.classList.remove('open'); Fx.card();
      await wait(320);
      chest.classList.add('rattle');

  // Recta numérica: saltos de Pipa
  function NumberLine(max) {
    const el = h('div', { class: 'nline pads' + (max > 10 ? ' n20' : '') });
    const ticks = h('div', { class: 'ticks' });
    const tEls = [];
    for (let i = 0; i <= max; i++) { const t = h('button', { class: 't', 'aria-label': 'número ' + i }, String(i)); tEls.push(t); ticks.appendChild(t); }
    const frog = h('div', { class: 'frog' }); frog.appendChild(pipa('', 'happy'));
    frog.querySelector('.pipa').style.width = '100%'; frog.querySelector('.pipa').style.height = '100%';
    el.appendChild(frog); el.appendChild(ticks);
    const pos = (n) => ((n + 0.5) / (max + 1)) * 100;
    let at = 0;
    function place(n) { at = n; frog.style.left = 'calc(8px + (100% - 16px) * ' + (pos(n) / 100) + ')'; }
    function hop(to, back) {
      const from = at;
      const l = Math.min(pos(from), pos(to)), w = Math.abs(pos(to) - pos(from));
      const arc = h('div', { class: 'arc' + (back ? ' back' : '') });
      arc.style.left = 'calc(8px + (100% - 16px) * ' + (l / 100) + ')';
      arc.style.width = 'calc((100% - 16px) * ' + (w / 100) + ')';
      el.appendChild(arc);
      frog.classList.remove('hop'); void frog.offsetWidth; frog.classList.add('hop');
      place(to);
    }
    function markStart(n) { tEls.forEach((t) => t.classList.remove('start')); if (n != null) tEls[n].classList.add('start'); }
    function clearArcs() { el.querySelectorAll('.arc').forEach((a) => a.remove()); }
    place(0);
    return { el, tEls, place, hop, markStart, clearArcs, get at() { return at; } };
  }
  ACT.jump = function (it, sh, done, ctx) {
    const back = it.op === '-';
    sh.root.classList.add('wide');
    const max = it.cap === 20 || it.a > 10 || it.c > 10 ? 20 : 10;
    const eq = Eq(C.exprText(it));
    sh.prompt.innerHTML = ''; sh.prompt.appendChild(eq.el);
    const nl = NumberLine(max);
    const coach = h('div', { class: 'coach' });
    sh.stage.appendChild(coach); sh.stage.appendChild(nl.el);
    const fixedStart = back || it.skill === 'more1' || it.a === 0 || it.b === 0;
    const big = fixedStart ? it.a : Math.max(it.a, it.b), small = fixedStart ? it.b : Math.min(it.a, it.b);
    let hint = false, jumps = 0;
    const jd = h('div', { class: 'jumps' });
    if (fixedStart) { startAt(); }
    else {
      coach.textContent = '¿Dónde empieza Pipa? Toca un número de la suma';

      nl.tEls.forEach((t) => t.classList.add('pickable'));
    }
    let picked = false;
    function pickStart(n) {
      if (picked) return;
      if (n === big) {
        picked = true; Voice.say('¡Muy bien! Empezamos en el número más grande.'); startAt();
      } else if (n === small && it.a !== it.b) {
        picked = true; hint = true;

    function startAt() {

      coach.textContent = 'Pipa está en el ' + big + '. ¡Salta ' + small + (back ? ' hacia atrás!' : '!');

    }

    const line = h('div', { class: 'nline pads placeline' });
    const ticks = h('div', { class: 'ticks' });
    const frog = h('div', { class: 'frog' }, pipa(''));
    frog.firstChild.style.width = '100%'; frog.firstChild.style.height = '100%';
    frog.style.display = 'none';
    const tEls = [];
    for (let v = lo; v <= hi; v++) {
      const known = it.labels.includes(v);
      const t = h('button', { class: 't place' + (known ? ' known' : ''), 'data-n': String(v), 'aria-label': known ? 'número ' + v : 'hueco' }, known ? String(v) : '');
      t.addEventListener('click', () => tap(v, t));
      tEls.push(t); ticks.appendChild(t);
    }
    line.appendChild(frog); line.appendChild(ticks);
    sh.stage.appendChild(line);
    const mid = lo + 5;
    Voice.say('¿Dónde va el ' + n + '? Toca su nenúfar. Fíjate en el ' + mid + ' y en el ' + hi + '.');
    let tries = 0, over = false;
    const put = (v) => { frog.style.display = ''; frog.style.left = 'calc(8px + (100% - 16px) * ' + ((v - lo + 0.5) / (hi - lo + 1)) + ')'; };
    function tap(v, t) {
      if (over || t.classList.contains('known')) return;
      tries++;
      if (v === n) {
        over = true; t.textContent = String(n); t.classList.add('known', 'hit'); put(n); Fx.hop(); Fx.good();
        const p = praise();
        const ref = n < mid ? (mid - n === 1 ? 'justo antes del ' + mid : (n - lo <= 2 ? 'cerca del ' + lo : 'antes del ' + mid)) : (n - mid === 1 ? 'justo después del ' + mid : (hi - n === 1 ? 'justo antes del ' + hi : 'entre el ' + mid + ' y el ' + hi));
        setMsg(sh, p + ' El ' + n + ' va ' + ref + '.', 'good'); Voice.say(p + ' El ' + n + ' va ' + ref + '.');
        finishBtn(sh, { correct: true, firstTry: tries === 1, hint: false, tries }, { done }, it);
      } else if (tries === 1) {
        t.textContent = String(v); t.classList.add('known', 'miss'); Fx.soft();
        const msg = 'Ese es el ' + v + '. El ' + n + ' va ' + (n > v ? 'después' : 'antes') + '.';
        setMsg(sh, msg, 'try'); Voice.say(msg + ' Cuenta desde el ' + (n > mid ? mid : lo) + '.');
      } else {
        over = true; Fx.soft();
        tEls.forEach((x, i) => { x.textContent = String(lo + i); x.classList.add('known'); });
        tEls[n - lo].classList.add('hit'); put(n);
        const msg = 'Mira: el ' + n + ' está aquí.';
        setMsg(sh, msg, 'try'); Voice.say('No pasa nada. ' + msg + ' ' + (n > mid ? 'Después del ' + mid + ': ' + Array.from({ length: n - mid }, (_, k) => mid + k + 1).join(', ') + '.' : ''));
        finishBtn(sh, { correct: false, firstTry: false, hint: false, tries }, { done }, it);
      }
    }
  };

  function pairsGame(step, body, next, sess) {
    const T = step.target;
    const g = C.makePairsGame(C.makeRng(Date.now() & 0xffff), T);
    const prompt = h('div', { class: 'prompt' }, '¡Busca las parejas del ' + T + '!', h('span', { class: 'sub' }, 'Toca dos tarjetas que juntas hacen ' + T));
    const grid = h('div', { class: 'cards' });
    const chips = h('div', { class: 'chips' });
    const tools = h('div', { class: 'tools' });
    body.appendChild(h('div', { class: 'act', style: { gridTemplateColumns: '1fr', gridTemplateRows: 'auto' } }, h('div', { class: 'left' }, prompt, grid, chips, tools)));
    let sel = null, left = g.cards.length, minis = false;
    const els = g.cards.map((c) => {
      const el = h('button', { class: 'card' }, h('span', null, String(c.v)));
      el.addEventListener('click', () => tap(c, el));
      grid.appendChild(el); return el;
    });
    const addMinis = () => { minis = true; g.cards.forEach((c, i) => { if (!els[i].querySelector('.mini')) els[i].appendChild(h('div', { class: 'mini' }, Frames(T <= 5 ? 5 : 10, cellsFor(T <= 5 ? 5 : 10, [['a', c.v]]), { size: 'none' }).el)); }); };
    tools.appendChild(h('button', { class: 'btn small', onclick: (e) => { e.currentTarget.remove(); addMinis(); } }, '💡 Ver fichas'));
    Voice.say('¡Juego de parejas! Busca dos tarjetas que juntas hacen ' + T + '.');
    function tap(c, el) {
      if (el.classList.contains('done')) return;
      if (!sel) { sel = { c, el }; el.classList.add('sel'); Fx.card(); return; }
      if (sel.el === el) { el.classList.remove('sel'); sel = null; return; }
      const a = sel.c.v, b = c.v, ok = a + b === T;
      const it = { skill: step.skill, key: C.bondKey(a, T), level: 2, kind: 'pairs' };
      C.recordAttempt(ST, it, { correct: ok, firstTry: ok, hint: minis, tries: 1 }, { mode: 'game' });
      if (ok) {
        sel.el.classList.remove('sel'); sel.el.classList.add('done'); el.classList.add('done'); left -= 2;
        chips.appendChild(h('span', { class: 'chip' }, a + ' + ' + b + ' = ' + T)); Fx.good();
        Voice.say(a + ' y ' + b + ' son ' + T + '. ¡Pareja!');
        sess.items++; sess.ok++; if (!minis) sess.indep++;
        sel = null;
        if (left === 0) setTimeout(() => { Voice.say('¡Has encontrado todas las parejas, ' + N() + '!'); toast('¡Todas las parejas! 🎉'); setTimeout(next, 1100); }, 500);
      } else {
        const s = sel; s.el.classList.add('no'); el.classList.add('no');
        Voice.say(a + ' y ' + b + ' son ' + (a + b) + '. ¡Busca otra pareja!');
        setTimeout(() => { s.el.classList.remove('no', 'sel'); el.classList.remove('no'); }, 500);
        sel = null;
      }
    }
  }

        Voice.say('¡Un doble! ' + d.n + ' más ' + d.n + ', ¿cuánto es?');
        optionFlow(sh, it2, {
          auto: true, plainWrong: true,
          explainRight: () => d.n + ' más ' + d.n + ' son ' + d.sum + '.',
          solutionSay: () => 'Mira: ' + d.n + ' más ' + d.n + ' son ' + d.sum + '.',
          done: (res) => {
            sess.items++; if (res.correct) sess.ok++;
            k++;
            if (k < rounds.length) round(); else { Fx.fanfare(); toast('🁫 ¡Dominó terminado!'); Voice.say('¡Muy bien! Ya te sabes los dobles.'); CUR.timers.push(setTimeout(next, 1300)); }
          },
        });
      };
      optionFlow(sh, it1, {
        auto: true, plainWrong: true,
        makeButton: (v) => h('button', { class: 'opt dopt', 'aria-label': v + ' puntos' }, dotsEl(v)),
        wrongText: () => 'En un doble, los dos lados son iguales.',
        onRight: () => { right.classList.remove('q'); right.textContent = ''; right.appendChild(dotsEl(d.n)); },
        onSolution: () => { right.classList.remove('q'); right.textContent = ''; right.appendChild(dotsEl(d.n)); },
        solutionSay: () => 'Mira: ' + d.n + ' y ' + d.n + '. Los dos lados iguales.',
        done: () => { sess.items++; part2(); },
      });
    };
    round();
  }
  // Memoria: tarjetas boca abajo; encontrar las dos que van juntas
  function memoryGame(step, body, next, sess) {
    const g = C.makeMemoryGame(C.makeRng(Date.now() & 0xffffff), step.skill);
    const T = g.rule.startsWith('sum') ? Number(g.rule.slice(3)) : null;
    const prompt = h('div', { class: 'prompt' }, T ? '¡Busca las parejas que suman ' + T + '!' : '¡Busca las parejas!');
    const grid = h('div', { class: 'cards mem' + (g.cards.length <= 6 ? ' six' : '') });
    const chips = h('div', { class: 'chips' });
    body.appendChild(h('div', { class: 'act', style: { gridTemplateColumns: '1fr', gridTemplateRows: 'auto' } }, h('div', { class: 'left' }, prompt, grid, chips)));
    APP.cur = { kind: 'memory' };
    let open = [], left = g.pairs, lock = false;
    const faceEl = (f) => f.t === 'dots' ? h('div', { class: 'mini' }, Frames(f.v <= 5 ? 5 : 10, cellsFor(f.v <= 5 ? 5 : 10, [['a', f.v]]), { size: 'none' }).el) : h('span', { class: f.t === 'expr' ? 'ex' : '' }, f.t === 'expr' ? f.text : String(f.v));
    const sayFace = (f) => (f.t === 'expr' ? C.exprSpeech(f.text + ' = ' + f.v).replace(/ son \d+$/, '') : String(f.v)) + '.';
    Voice.say(T ? 'Juego de memoria. Destapa dos tarjetas. Si juntas suman ' + T + ', te las quedas.' : 'Juego de memoria. Destapa dos tarjetas y busca las que van juntas.');
    g.cards.forEach((c) => {
      const el = h('button', { class: 'card flip', 'data-pair': String(c.pair), 'aria-label': 'Tarjeta' }, h('span', { class: 'back', 'aria-hidden': 'true' }, '🍃'), h('span', { class: 'front' }, faceEl(c.face)));
      el.addEventListener('click', () => {
        if (lock || el.classList.contains('up') || el.classList.contains('done')) return;
        el.classList.add('up'); Fx.card();
        open.push({ c, el });
        if (open.length < 2) { Voice.say(sayFace(c.face)); return; }
        const [x, y] = open; open = [];
        sess.items++;
        if (x.c.pair === y.c.pair) {
          sess.ok++; left--;
          x.el.classList.add('done'); y.el.classList.add('done'); Fx.good();
          const ex = [x.c.face, y.c.face].find((f) => f.t === 'expr');
          const t = T ? x.c.face.v + ' y ' + y.c.face.v + ' son ' + T + '.' : (ex ? C.exprSpeech(ex.text + ' = ' + ex.v) + '.' : x.c.face.v + '.');
          chips.appendChild(h('span', { class: 'chip' }, T ? x.c.face.v + ' + ' + y.c.face.v + ' = ' + T : (ex ? ex.text + ' = ' + ex.v : String(x.c.face.v))));
          Voice.say('¡Pareja! ' + t);
          if (left === 0) CUR.timers.push(setTimeout(() => { Fx.fanfare(); toast('🍃 ¡Todas las parejas!'); Voice.say('¡Las has encontrado todas, ' + N() + '!'); CUR.timers.push(setTimeout(next, 1300)); }, 900));
        } else {
          lock = true;
          Voice.say(sayFace(c.face) + (T ? ' ' + x.c.face.v + ' y ' + y.c.face.v + ' son ' + (x.c.face.v + y.c.face.v) + '.' : ' No van juntas.'));
          CUR.timers.push(setTimeout(() => { x.el.classList.remove('up'); y.el.classList.remove('up'); lock = false; }, 1500));
        }
      });
      grid.appendChild(el);
    });
  }

  /* ---------- lección: "Mira cómo lo hace Pipa" ---------- */
  function lessonScreen(skill, body, next) {
    const steps = C.LESSONS[skill];
    if (!steps) { next(); return; }
    let i = 0;
    const title = h('div', { class: 'lesson-title' }, pipa('sm live'), 'Mira cómo lo hace Pipa');
    const view = h('div', { class: 'stage' });
    const txt = h('div', { class: 'lesson-text' });
    const btns = h('div', { class: 'tools' });
    body.appendChild(h('div', { class: 'act', style: { gridTemplateColumns: '1fr', gridTemplateRows: 'auto' } }, h('div', { class: 'left' }, title, view, txt, btns)));
    async function render() {
      const s = steps[i];
      view.innerHTML = ''; txt.textContent = s.text; btns.innerHTML = '';
      if (s.v.t === 'frame') view.appendChild(framesFromPattern(s.v.p).el);
      else if (s.v.t === 'hands') view.appendChild(Hands(s.v.n));
      else if (s.v.t === 'fingers') view.appendChild(FingerCount(s.v.start, s.v.n, false));
      else {
        const nl = NumberLine(s.v.max); view.appendChild(nl.el);
        nl.place(s.v.start); nl.markStart(s.v.start);
        const dir = s.v.dir === -1 ? -1 : 1;
        const myI = i;
        (async () => { await wait(900); for (let k = 1; k <= s.v.jumps; k++) { if (i !== myI || !view.isConnected) return; nl.hop(s.v.start + dir * k, dir < 0); await wait(650); } })();
      }
      btns.appendChild(h('button', { class: 'btn small', onclick: () => Voice.say(s.say) }, '🔊 Otra vez'));
      const last = i === steps.length - 1;
      const finish = () => { Voice.stop(); if (ST && ST.skills[skill]) ST.skills[skill].needLesson = false; next(); };
      if (!last && i === 0) btns.appendChild(h('button', { class: 'btn small', onclick: finish }, 'Ya lo sé ⏭'));
      btns.appendChild(h('button', { class: 'btn primary big', onclick: () => { if (last) finish(); else { Voice.stop(); i++; render(); } } }, last ? '¡Ahora tú! ➜' : 'Siguiente ➜'));
      Voice.say(s.say);
    }
    render();
  }

  /* ---------- sesión ---------- */
  const CUR = { guided: false, challenge: false, timers: [] };
  let SESSION = 0; // cambia al salir: invalida temporizadores pendientes
  function clearTimers() { CUR.timers.forEach(clearTimeout); CUR.timers = []; clearTimeout(CUR.idle); }
  document.addEventListener('pointerdown', () => { if (CUR.rearm && APP.exit) CUR.rearm(); }, true);
  const APP = { cur: null };

  // Frase de cierre: valora el esfuerzo y la estrategia, no la rapidez
  const STRAT_PRAISE = {
    sub5: 'Has visto las fichas de un vistazo, sin contarlas una a una.',
    compare: 'Te has fijado bien en dónde había más.',
    sub10: 'Has usado el cinco para ver las cantidades.',
    bond5: 'Has buscado los huecos que faltan para el cinco.',
    bond10: 'Has buscado los huecos que faltan para el diez.',
    more1: 'Has pensado en el número de después y en el de antes.',
    addon: 'Has empezado por el número más grande, como Pipa.',
    dbl: 'Has usado los dobles.',
    from10: 'Has usado las parejas del diez para restar.',
    bondN: 'Has partido los números de muchas maneras.',
    add10: 'Has usado trucos: dobles, parejas y contar desde el mayor.',
    sub10t: 'Has pensado cuánto falta para restar.',
    teen: 'Has visto los números grandes como diez y algo.',
    add20: 'Has llenado primero el diez.',
    sub20: 'Has bajado primero al diez.',
    near: 'Has usado los dobles para sacar los casi dobles.',
    mix10: 'Has mirado bien el signo antes de calcular.',
    teen2: 'Has visto los números como diez y algo para quitar.',
    mix20: 'Has mirado el signo y has pasado por el diez.',
  };

  function topBar(frac, onExit, label) {
    const pct = Math.max(3, Math.min(100, frac * 100));
    const bar = h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(frac * 100)), 'aria-label': 'Progreso' },
      h('i', { style: { width: pct + '%' } }), h('span', { class: 'pad', style: { left: pct + '%' } }), h('span', { class: 'goal' }, '🌸'));
    return h('div', { class: 'topbar' },
      h('button', { class: 'iconbtn', 'aria-label': 'Salir', onclick: onExit }, '🏠'),
      h('div', { class: 'pwrap' }, label ? h('div', { class: 'plabel' }, label) : null, bar),
      h('button', { class: 'pipabtn', 'aria-label': 'Repetir lo que dice Pipa', onclick: () => Voice.repeat() }, pipa('live')));
  }
  function riverBar(k, n) {
    const r = h('div', { class: 'river' }, h('span', { class: 'bank' }, '🌳'));
    for (let i = 0; i < n; i++) r.appendChild(h('span', { class: 'stone' }, i === k ? pipa('') : null));
    r.appendChild(h('span', { class: 'bank' }, k >= n ? pipa('') : '🏁'));
    return r;
  }
  function expandPlan(plan) {
    const out = [];
    plan.forEach((s) => {
      if (s.type === 'game' && s.game === 'river') for (let k = 0; k < s.n; k++) out.push({ type: 'item', skill: s.skill, mode: 'normal', phase: 'game', river: { k, n: s.n } });
      else out.push(s);
    });
    return out;
  }

  // opts: { kind: 'lesson' | 'challenge' | 'diag' | 'explain', skill, level }
  function runSession(rawPlan, opts) {
    opts = opts || {};
    const token = ++SESSION;
    const plan = expandPlan(rawPlan);
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    if (opts.kind === 'day') ST = C.dayState(S.progress, seed);
    else { ST = C.newState(seed, { level: opts.level }); if (opts.kind !== 'diag' && opts.kind !== 'explain') { ST.mem = S.progress.facts; ST.day = S.progress.day; } }
    const rng = C.makeRng(seed);
    const sess = { items: 0, ok: 0, indep: 0, start: Date.now(), replays: 0, challenge: null, diag: [], pr: { n: 0, indep: 0 }, ck: { n: 0, indep: 0 } };
    let idx = -1;
    let ch = null, chDone = 0;
    keepAwake(true);
    const alive = () => token === SESSION;
    const exit = async () => {
      Voice.stop();
      Voice.say('¿Lo dejamos aquí? Toca el botón verde para seguir jugando.');
      const v = await modal('¿Lo dejamos aquí?', '¡Lo has hecho muy bien!', [{ t: '▶ Seguir', v: false, cls: 'primary' }, { t: '🏠 Terminar', v: true }]);
      Voice.stop();
      if (v && alive()) { SESSION++; clearTimers(); keepAwake(false); save(); homeScreen(); }
    };
    APP.exit = exit;
    // Si no toca nada en un rato, Pipa repite lo que hay que hacer (hasta 2 veces por pantalla)
    function armIdle(n) {
      clearTimeout(CUR.idle);
      if (n >= 2) return;
      CUR.idle = setTimeout(() => {
        if (!alive() || document.querySelector('.modal-bg')) return;
        if (!(window.speechSynthesis && window.speechSynthesis.speaking) && !(Voice.audio && !Voice.audio.paused && !Voice.audio.ended)) { Voice.repeat(); document.body.classList.add('nudge'); setTimeout(() => document.body.classList.remove('nudge'), 2500); }
        armIdle(n + 1);
      }, 16000);
    }
    CUR.rearm = () => armIdle(0);
    function screen(frac, label) {
      clearTimers(); armIdle(0);
      const scr = h('div', { class: 'screen' });
      scr.appendChild(topBar(frac, exit, label));
      const body = h('div', { class: 'body' });
      scr.appendChild(body);
      show(scr);
      return body;
    }
    function next() {
      if (!alive()) return;
      if (ch) return nextChallenge();
      idx++;
      const step = plan[idx];
      if (!step || step.type === 'end') { finish(); return; }
      if (step.type === 'challenge') { startChallenge(); return; }
      const frac = idx / plan.length;
      if (step.type === 'offer') return offerScreen(step.skill, (yes) => { if (yes) plan.splice(idx + 1, 0, { type: 'challenge' }); next(); });
      const body = screen(frac);
      CUR.guided = false; CUR.challenge = false; NOAUTO = false;
      if (step.type === 'lesson') return lessonScreen(step.skill, body, next);
      if (step.type === 'game') {
        APP.cur = null;
        if (step.game === 'pairs') return pairsGame(step, body, next, sess);
        if (step.game === 'match') return matchGame(step, body, next, sess);
        if (step.game === 'dice') return diceGame(step, body, next, sess);
        if (step.game === 'bubbles') return bubblesGame(step, body, next, sess);
        if (step.game === 'flies') return fliesGame(step, body, next, sess);
        if (step.game === 'shop') return shopGame(step, body, next, sess);
        if (step.game === 'balance') return balanceGame(step, body, next, sess);
        if (step.game === 'memory') return memoryGame(step, body, next, sess);
        if (step.game === 'sheet') return sheetGame(step, body, next, sess);
        if (step.game === 'order') return orderGame(step, body, next, sess);
        if (step.game === 'domino') return dominoGame(step, body, next, sess);
        return next();
      }
      // ejercicio
      const it = step.item || C.itemForSlot(ST, step, rng);
      APP.cur = it;
      if (step.river) body.appendChild(riverBar(step.river.k, step.river.n));
      if (step.phase === 'warm' && idx === 0) body.appendChild(h('div', { class: 'phase' }, '🔥 Para calentar'));
      const sh = Shell('');
      body.appendChild(sh.root);
      CUR.guided = step.mode === 'guided';
      const fn = ACT[it.kind] || ACT.choose;
      fn(it, sh, (res) => onDone(it, step, res), { guided: CUR.guided });
    }
    function onDone(it, step, res) {
      if (!alive()) return;
      sess.items++; if (res.correct) sess.ok++;
      if (res.correct && res.firstTry && !res.hint) sess.indep++;
      streak(res);
      if (opts.kind === 'diag') {
        sess.diag.push({ tag: it.diag, correct: res.correct, firstTry: res.firstTry, hint: res.hint });
      } else {
        const out = C.recordAttempt(ST, it, res, { mode: step.mode || 'normal' });
        if (step.phase === 'checkup') { sess.ck.n++; if (out.indep) sess.ck.indep++; }
        if ((step.mode || 'normal') === 'normal' && it.skill === opts.skill && it.kind !== 'talk' && !step.river) { sess.pr.n++; if (out.indep) sess.pr.indep++; }
        if (out.events.includes('levelUp')) { toast('⭐ ¡Subes un escalón!'); Fx.levelup(); }
        if (out.events.includes('struggle') && (opts.kind === 'lesson' || opts.kind === 'day')) {
          // volver a la explicación (como mucho dos veces) y a un ejercicio más sencillo
          const again = [];
          if (C.LESSONS[it.skill] && sess.replays < 2) { again.push({ type: 'lesson', skill: it.skill }); sess.replays++; }
          again.push({ type: 'item', skill: it.skill, mode: 'guided', phase: 'guided', levelOffset: -1, ease: true });
          plan.splice(idx + 1, 0, ...again);
        }
        if (step.river && step.river.k === step.river.n - 1) toast('🐸 ¡Pipa ha cruzado el río!');
      }
      next();
    }
    // pequeña fiesta cada 5 aciertos seguidos a la primera (premia la constancia, no la rapidez)
    function streak(res) {
      sess.streak = (res.correct && res.firstTry) ? (sess.streak || 0) + 1 : 0;
      if (sess.streak && sess.streak % 5 === 0) { toast('🌟 ¡' + sess.streak + ' seguidas!'); Fx.levelup(); }
    }
    // ----- reto final -----
    function startChallenge() {
      ch = C.makeChallenge(opts.skill, seed ^ 0x5bd1e995);
      sess.challenge = ch;
      introScreen(
        '🏆', 'Reto final', C.LESSON_INFO[opts.skill].short,
        'Ahora, el reto final. Vas a hacer muchas seguidas, sin prisa. Si te equivocas, puedes volver a intentarlo. ¿Preparada?',
        '¡Vamos! ➜', () => nextChallenge());
    }
    function nextChallenge() {
      if (!alive()) return;
      const it = C.challengeNext(ch);
      if (!it) { const r = C.challengeResult(ch); ch = null; sess.challengeResult = r; CUR.challenge = false; NOAUTO = false; if (r.passed) { Fx.fanfare(); toast('🏆 ¡Reto superado!'); } next(); return; }
      if (ch.enteringReview) {
        const pending = it;
        return introScreen('🔁', 'Repaso', '', 'Vamos a repasar las que te costaron.', '¡Vamos! ➜', () => showChallengeItem(pending), 1);
      }
      showChallengeItem(it);
    }
    function showChallengeItem(it) {
      const total = ch.n;
      const label = ch.phase === 'review' ? '🔁 Repaso' : '🏆 ' + Math.min(chDone + 1, total) + ' de ' + total;
      const body = screen(ch.phase === 'review' ? 1 : chDone / total, label);
      CUR.guided = false; CUR.challenge = true; NOAUTO = true;
      APP.cur = it;
      const sh = Shell('');
      body.appendChild(sh.root);
      const fn = ACT[it.kind] || ACT.choose;
      fn(it, sh, (res) => {
        if (!alive()) return;
        if (ch.phase === 'main') chDone++;
        sess.items++; if (res.correct) sess.ok++;
        streak(res);
        if (ST.mem && ch.phase === 'main') C.noteFact(ST, it.spec.key, { indep: !!(res.correct && res.firstTry && !res.hint), correct: !!res.correct, firstTry: !!res.firstTry, ms: res.hint ? null : res.ms });
        C.challengeRecord(ch, it, res);
        nextChallenge();
      }, { guided: false, challenge: true });
    }
    function introScreen(icon, title, sub, say, btn, go, fracOverride) {
      const body = screen(fracOverride != null ? fracOverride : (idx / plan.length), ch ? '🏆 Reto' : null);
      body.appendChild(h('div', { class: 'center intro' },
        h('div', { class: 'bigicon' }, icon),
        h('h1', null, title), sub ? h('p', { class: 'muted strong' }, sub) : null,
        h('div', { class: 'bubble' }, say),
        h('button', { class: 'btn primary big', onclick: () => { Voice.stop(); go(); } }, btn)));
      Voice.say(say);
    }
    function offerScreen(skill, cb) {
      const body = screen(idx / plan.length);
      const trophy = S.trophies[skill];
      body.appendChild(h('div', { class: 'center intro' },
        pipa('lg bob live', 'wow'),
        h('div', { class: 'bubble' }, '¡Muy bien! ¿Hacemos el reto final?'),
        trophy ? h('p', { class: 'muted strong' }, 'Ya tienes este trofeo 🏆. ¡Puedes repetirlo!') : null,
        h('div', { class: 'row' },
          h('button', { class: 'btn orange big', onclick: () => { Voice.stop(); cb(true); } }, '🏆 ¡Al reto!'),
          h('button', { class: 'btn big', onclick: () => { Voice.stop(); cb(false); } }, 'Terminar'))));
      Voice.say('¡Muy bien, ' + N() + '! ¿Hacemos el reto final? Son muchas seguidas. O si estás cansada, terminamos por hoy.');
    }
    function finish() {
      if (!alive()) return;
      clearTimers(); Voice.stop(); keepAwake(false); APP.exit = null; CUR.rearm = null;
      CUR.challenge = false; NOAUTO = false;
      if (opts.kind === 'diag') return diagResult(C.recommendLesson(sess.diag));
      if (opts.kind === 'explain') return homeScreen();
      if (opts.kind === 'bonus') return gameReward(addPoints(Math.max(3, Math.min(10, sess.ok))), () => albumScreen(true), '🌿 Mi charca');
      if (opts.kind === 'games') return gameReward(addPoints(Math.max(6, Math.min(18, sess.ok))), gamesScreen);
      const r = sess.challengeResult || null;
      APP.last = { skill: opts.skill, kind: opts.kind, result: r, items: sess.items, ok: sess.ok, ms: Date.now() - sess.start };
      let dayInfo = null;
      if (opts.kind === 'day') {
        const events = C.finishDay(S.progress, opts.plan, { date: today(), level: opts.skill ? ST.skills[opts.skill].level : null, practice: sess.pr, checkup: sess.ck, challenge: r });
        dayInfo = { plan: opts.plan, events };
        APP.last.day = S.progress.day; APP.last.type = opts.plan.type; APP.last.events = events;
      }
      if (r && r.passed) {
        S.trophies[opts.skill] = { day: today(), score: r.firstOk + '/' + r.total };
        C.markPassed(S.progress, opts.skill);
      }
      save();
      endScreen(opts.skill, sess, r, dayInfo);
    }
    next();
  }

  function startLesson(skill, level) {
    S.last = skill; save();
    tryFullscreen();
    const plan = C.planLesson(skill, { seed: (Date.now() & 0x7fffffff) || 1, short: !!S.settings.short, lastGame: S.lastGame[skill] });
    const g = plan.find((x) => x.type === 'game');
    if (g) S.lastGame[skill] = g.game;
    save();
    runSession(plan, { kind: 'lesson', skill, level: level == null ? 'auto' : level });
  }
  function startDay() {
    const P = S.progress;
    const cur = C.currentLesson(P);
    const plan = C.planDay(P, { seed: ((Date.now() & 0x7fffffff) || 1), short: !!S.settings.short, lastGame: cur ? S.lastGame[cur] : null });
    const g = plan.steps.find((x) => x.type === 'game');
    if (g && plan.skill) S.lastGame[plan.skill] = g.game;
    if (plan.skill) S.last = plan.skill;
    save();
    tryFullscreen();
    runSession(plan.steps, { kind: 'day', skill: plan.skill, plan, level: 'auto' });
  }
  function freeGame() {
    const P = S.progress;
    const pool = C.passedLessons(P).concat(C.currentLesson(P) ? [C.currentLesson(P)] : []);
    const skill = rnd(pool.length ? pool : ['sub5']);
    runSession([C.gameFor(skill, Math.random, { avoid: S.lastGame[skill] }), { type: 'end' }], { kind: 'bonus', skill });
  }
  function startChallengeOnly(skill) {
    S.last = skill; save();
    tryFullscreen();
    runSession([{ type: 'challenge' }, { type: 'end' }], { kind: 'challenge', skill, level: 2 });
  }
  function explainOnly(skill) {
    runSession([{ type: 'lesson', skill }, { type: 'end' }], { kind: 'explain', skill });
  }

  /* ---------- puntos y premios ---------- */
  // Cada acierto da una estrella (y terminar una sesión, un reto o un examen, alguna más).
  // Cada 40 estrellas llega un amigo nuevo a «Mi charca». Premia el trabajo, no la rapidez.
  const STAR_STEP = 40;
  function addPoints(n) {
    n = Math.max(0, Math.round(n || 0));
    const before = S.points || 0;
    S.points = before + n;
    const friends = [];
    for (let k = Math.floor(before / STAR_STEP); k < Math.floor(S.points / STAR_STEP); k++) {
      const free = STICKERS.filter((x) => !S.stickers.includes(x));
      if (!free.length) break;
      const f = rnd(free); S.stickers.push(f); friends.push(f);
    }
    save();
    return { gained: n, before, total: S.points, friends };
  }
  function starBar(from, compact) {
    const total = S.points || 0, into = total % STAR_STEP, done = S.stickers.length >= STICKERS.length;
    const fill = h('i', { style: { width: ((from != null ? from % STAR_STEP : into) / STAR_STEP * 100) + '%' } });
    const el = h('div', { class: 'starbar' + (compact ? ' compact' : ''), role: 'progressbar', 'aria-label': 'Estrellas para el próximo amigo', 'aria-valuemin': '0', 'aria-valuemax': String(STAR_STEP), 'aria-valuenow': String(into) },
      h('span', { class: 'sb-ic', 'aria-hidden': 'true' }, '⭐'), h('div', { class: 'sb-track' }, fill), h('span', { class: 'sb-n' }, into + ' / ' + STAR_STEP), h('span', { class: 'sb-gift', 'aria-hidden': 'true' }, done ? '🌟' : '🎁'));
    if (from != null) setTimeout(() => { fill.style.width = (into / STAR_STEP * 100) + '%'; }, 350);
    return el;
  }
  // Lo que se enseña al ganar estrellas: «+12 ⭐», la barra que avanza y, si toca, el amigo nuevo
  function rewardBox(r) {
    const kids = [h('div', { class: 'gain' }, '+' + r.gained + ' ⭐'), starBar(r.friends.length ? 0 : r.before)];
    r.friends.forEach((f) => kids.push(h('div', { class: 'newfriend' }, h('div', { class: 'sticker-big', 'aria-label': 'amigo nuevo' }, f), h('div', { class: 'muted strong' }, '¡Nuevo amigo para tu charca!'))));
    return h('div', { class: 'reward' }, kids);
  }
  function rewardSay(r) {
    return r.friends.length ? ' Has llenado la barra de estrellas. ¡Tienes un amigo nuevo en tu charca!' : (r.gained ? ' Has ganado ' + r.gained + (r.gained === 1 ? ' estrella.' : ' estrellas.') : '');
